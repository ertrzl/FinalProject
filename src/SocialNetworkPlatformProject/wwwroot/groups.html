<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gruplar | SocialNet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>
</head>
<body>

<nav class="navbar navbar-expand bg-white border-bottom sticky-top py-2">
  <div class="container-fluid px-4">
    <a class="navbar-brand fs-4" href="home.html">SocialNet</a>
    <form class="d-none d-md-flex align-items-center bg-body-tertiary rounded-pill px-3 py-2 mx-3 nav-search-wrap" style="max-width:380px; flex:1;" onsubmit="return submitSearch(this)">
      <i class="bi bi-search text-muted me-2"></i>
      <input type="text" class="form-control form-control-sm border-0 bg-transparent p-0 shadow-none" placeholder="Kullanıcı ara..." name="q">
    </form>
    <div class="d-flex align-items-center gap-1 ms-auto">
      <a href="home.html" class="nav-pill-link"><i class="bi bi-house-door-fill"></i>Ana Sayfa</a>
      <a href="friends.html" class="nav-pill-link"><i class="bi bi-people-fill"></i>Arkadaşlar</a>
      <a href="notifications.html" class="nav-pill-link">
        <i class="bi bi-bell-fill"></i>Bildirimler
        <span class="position-absolute top-0 end-0 badge rounded-pill bg-danger badge-count">3</span>
      </a>
      <a href="messages.html" class="nav-pill-link"><i class="bi bi-chat-dots-fill"></i>Mesajlar</a>
      <a href="groups.html" class="nav-pill-link active"><i class="bi bi-diagram-3-fill"></i>Gruplar</a>
      <a href="marketplace.html" class="nav-pill-link"><i class="bi bi-shop"></i>Marketplace</a>
      <a href="events.html" class="nav-pill-link"><i class="bi bi-calendar-event"></i>Etkinlikler</a>
      <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" title="Temayı Değiştir"><i class="bi bi-moon-stars-fill"></i></button>
      <div class="dropdown ms-2">
        <button class="btn p-0 border-0 bg-transparent" data-bs-toggle="dropdown">
          <img src="images/default-avatar.png" class="avatar-xs" alt="Profilim">
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>Profilim</a></li>
          <li><a class="dropdown-item" href="saved.html"><i class="bi bi-bookmark me-2"></i>Kaydedilenler</a></li>
          <li><a class="dropdown-item" href="settings.html"><i class="bi bi-gear me-2"></i>Ayarlar</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="index.html"><i class="bi bi-box-arrow-right me-2"></i>Çıkış Yap</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4" style="max-width: 980px;">

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h1 class="h4 mb-0 fw-bold">Gruplar</h1>
    <button class="btn btn-primary rounded-pill" data-bs-toggle="modal" data-bs-target="#createGroupModal"><i class="bi bi-plus-lg me-1"></i>Grup Oluştur</button>
  </div>

  <ul class="nav nav-pills gap-2 mb-4">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#panel-mygroups">Gruplarım (<span id="myGroupsCount">0</span>)</button></li>
    <li class="nav-item"><button class="nav-link text-muted" data-bs-toggle="pill" data-bs-target="#panel-discover">Keşfet</button></li>
  </ul>

  <div class="tab-content">

    <!-- My groups -->
    <div class="tab-pane fade show active" id="panel-mygroups">
      <div id="myGroupsGrid" class="row g-3"><div class="text-muted small">Yükleniyor...</div></div>
    </div>

    <!-- Discover -->
    <div class="tab-pane fade" id="panel-discover">
      <div class="mb-3">
        <div class="d-flex align-items-center bg-body-tertiary rounded-pill px-3 py-2" style="max-width:340px;">
          <i class="bi bi-search text-muted me-2"></i>
          <input type="text" id="discoverSearch" class="form-control form-control-sm border-0 bg-transparent p-0 shadow-none" placeholder="Grup ara..." oninput="loadDiscoverGroups()">
        </div>
      </div>
      <div id="discoverGrid" class="row g-3"><div class="text-muted small">Yükleniyor...</div></div>
    </div>

  </div>
</div>

<!-- Create group modal -->
<div class="modal fade" id="createGroupModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Grup Oluştur</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Grup Adı</label>
          <input type="text" id="groupName" class="form-control" placeholder="Örn. Kitap Kulübü">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Açıklama</label>
          <textarea id="groupDescription" class="form-control" rows="3" placeholder="Bu grup ne hakkında?"></textarea>
        </div>
        <div class="mb-1">
          <label class="form-label fw-semibold small">Gizlilik</label>
          <select id="groupPrivacy" class="form-select">
            <option value="Public">🌐 Genel</option>
            <option value="Private">🔒 Gizli</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light rounded-pill" data-bs-dismiss="modal">Vazgeç</button>
        <button type="button" class="btn btn-primary rounded-pill" onclick="publishGroup()">Oluştur</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div id="chatDock" class="chat-dock">
  <div class="chat-dock-bar" onclick="toggleChatDockList()">
    <i class="bi bi-chat-dots-fill"></i> Sohbetler
  </div>
  <div class="chat-dock-list d-none" id="chatDockList"></div>
</div>
<div id="chatPopups" class="chat-popups"></div>

<script src="js/app.js"></script>
<script src="js/navbar-badge.js"></script>
<script src="js/chat-data.js"></script>
<script src="js/chat-dock.js"></script>
<script src="js/groups.js"></script>
</body>
</html>
