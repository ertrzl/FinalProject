<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Arkadaşlar | Stoop</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/inbox.css">
<script src="js/design.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
</head>
<body>

<nav id="siteNav" data-active="friends"></nav>

<div class="container py-4" style="max-width: 820px;">
<div class="page-split page-solo">
  <div class="page-head inbox-only"><h1 class="h4 fw-bold mb-1">Arkadaşlar</h1></div>
  <div class="page-main">

  <!-- F2: Friend request system — send, accept, and decline connections -->
  <ul class="nav nav-pills gap-2 mb-4 flex-wrap">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#panel-requests">Gelen İstekler (<span id="incomingCount">0</span>)</button></li>
    <li class="nav-item"><button class="nav-link text-muted" data-bs-toggle="pill" data-bs-target="#panel-sent">Gönderilen İstekler</button></li>
    <li class="nav-item"><button class="nav-link text-muted" data-bs-toggle="pill" data-bs-target="#panel-all">Arkadaşlarım (<span id="friendsCount">0</span>)</button></li>
    <li class="nav-item"><button class="nav-link text-muted" data-bs-toggle="pill" data-bs-target="#panel-suggestions">Öneriler</button></li>
  </ul>

  <div class="tab-content">

    <!-- Incoming requests -->
    <div class="tab-pane fade show active" id="panel-requests">
      <div class="card border-0 shadow-sm rounded-4 p-3">
        <div class="fw-bold mb-3 list-title">Gelen Arkadaşlık İstekleri</div>
        <div id="incomingRequestsList"><div class="text-muted small">Yükleniyor...</div></div>
      </div>
    </div>

    <!-- Sent requests -->
    <div class="tab-pane fade" id="panel-sent">
      <div class="card border-0 shadow-sm rounded-4 p-3">
        <div class="fw-bold mb-3 list-title">Gönderilen İstekler</div>
        <div id="sentRequestsList"><div class="text-muted small">Yükleniyor...</div></div>
      </div>
    </div>

    <!-- All friends -->
    <div class="tab-pane fade" id="panel-all">
      <div class="card border-0 shadow-sm rounded-4 p-3">
        <div class="fw-bold mb-3 list-title">Tüm Arkadaşlar</div>
        <div id="friendsList" class="row g-3"><div class="text-muted small">Yükleniyor...</div></div>
      </div>
    </div>

    <!-- Suggestions -->
    <div class="tab-pane fade" id="panel-suggestions">
      <div class="card border-0 shadow-sm rounded-4 p-3">
        <div class="fw-bold mb-3 list-title">Tanıyor Olabilirsin</div>
        <div id="suggestionsList" class="row g-3"><div class="text-muted small">Yükleniyor...</div></div>
      </div>
    </div>

  </div>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div id="chatDock" class="chat-dock">
  <div class="chat-dock-bar" onclick="toggleChatDockList()">
    <i class="bi bi-chat-dots-fill"></i> Sohbetler
  </div>
  <div class="chat-dock-list d-none" id="chatDockList"></div>
</div>
<div id="chatPopups" class="chat-popups"></div>

<script src="js/navbar.js"></script>
<script src="js/app.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/navbar-badge.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<script src="js/realtime.js"></script>
<script src="js/navbar-search.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.21.3/index.js"></script>
<script src="js/chat-data.js"></script>
<script src="js/chat-composer.js"></script>
<script src="js/chat-dock.js"></script>
<script src="js/friends.js"></script>
</body>
</html>
