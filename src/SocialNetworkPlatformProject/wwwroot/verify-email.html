<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<title>E-postanı Doğrula | Stoop</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/inbox.css">
<script src="js/design.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
</head>
<body>

<div class="auth-gradient d-flex align-items-center justify-content-center p-3">
  <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 text-center" style="max-width: 420px; width:100%;">
    <h1 class="visually-hidden">E-postanı Doğrula</h1>
    <div class="auth-logo mb-4">Stoop</div>

    <div id="verifyWorking">
      <div class="spinner-border text-primary mb-3" role="status"></div>
      <p class="text-muted small mb-0">E-postan doğrulanıyor...</p>
    </div>

    <div id="verifyDone" class="d-none">
      <i class="bi bi-check-circle-fill text-success" style="font-size: 2.5rem;"></i>
      <p class="fw-semibold mt-2 mb-1">E-postan doğrulandı</p>
      <p class="text-muted small mb-3">Hesabın artık etkin. Şimdi giriş yapabilirsin.</p>
      <a href="index.html" class="btn btn-primary rounded-pill px-4 fw-semibold">Giriş Yap</a>
    </div>

    <div id="verifyFailed" class="d-none">
      <i class="bi bi-x-circle-fill text-danger" style="font-size: 2.5rem;"></i>
      <p class="fw-semibold mt-2 mb-1">Doğrulanamadı</p>
      <p class="text-muted small mb-3" id="verifyFailedText"></p>
      <p class="text-muted small mb-0">Giriş sayfasında hesabınla giriş yapmayı dene, yeni bir doğrulama e-postası isteyebilirsin.</p>
      <a href="index.html" class="btn btn-outline-primary rounded-pill px-4 fw-semibold mt-3">Giriş sayfasına git</a>
    </div>
  </div>
</div>

<script>
const verifyParams = new URLSearchParams(window.location.search);
const verifyEmail = verifyParams.get("email") || "";
const verifyToken = verifyParams.get("token") || "";
window.history.replaceState(null, "", window.location.pathname);

function showVerifyResult(ok, message) {
  document.getElementById("verifyWorking").classList.add("d-none");
  document.getElementById(ok ? "verifyDone" : "verifyFailed").classList.remove("d-none");
  if (!ok) document.getElementById("verifyFailedText").textContent = message;
}

(async function () {
  if (!verifyEmail || !verifyToken) {
    showVerifyResult(false, "Bu bağlantı eksik ya da bozuk. E-postandaki bağlantıyı yeniden aç.");
    return;
  }

  try {
    await apiFetchAnonymous("/api/auth/verify-email", {
      method: "POST",
      body: { email: verifyEmail, token: verifyToken }
    });
    showVerifyResult(true);
  } catch (err) {
    showVerifyResult(false, err.message || "Doğrulama yapılamadı.");
  }
})();
</script>

</body>
</html>
