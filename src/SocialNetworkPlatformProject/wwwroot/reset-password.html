<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şifreni Sıfırla | SocialNet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>
</head>
<body>

<!-- The page the password reset e-mail links to: reset-password.html?email=...&token=... -->
<div class="auth-gradient d-flex align-items-center justify-content-center p-3">
  <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5" style="max-width: 420px; width:100%;">
    <div class="text-center mb-4">
      <div class="auth-logo">SocialNet</div>
      <p class="text-muted small mb-0" id="resetIntro">Yeni şifreni belirle.</p>
    </div>

    <div id="resetError" class="alert alert-danger py-2 small d-none"></div>

    <form id="resetForm">
      <div class="mb-3">
        <label for="newPassword" class="form-label fw-semibold small">Yeni şifre</label>
        <input type="password" class="form-control" id="newPassword" placeholder="••••••••" autocomplete="new-password" required>
      </div>
      <div class="mb-4">
        <label for="confirmPassword" class="form-label fw-semibold small">Yeni şifre (tekrar)</label>
        <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">
        <span id="resetBtnText">Şifreyi Değiştir</span>
        <span id="resetSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
      </button>
    </form>

    <div id="resetDone" class="d-none text-center">
      <i class="bi bi-check-circle text-success" style="font-size: 2.5rem;"></i>
      <p class="fw-semibold mt-2 mb-1">Şifren değiştirildi</p>
      <p class="text-muted small mb-3">Açık olan tüm oturumlar kapatıldı. Yeni şifrenle giriş yapabilirsin.</p>
      <a href="index.html" class="btn btn-primary rounded-pill px-4 fw-semibold">Giriş Yap</a>
    </div>

    <p class="text-center text-muted small mt-4 mb-0" id="resetHelp">
      Bağlantı çalışmıyor mu? <a href="forgot-password.html" class="text-primary fw-semibold">Yeni bağlantı iste</a>
    </p>
  </div>
</div>

<script>
// The link carries the e-mail and the one-time code. Keep them in memory and take them out of the address bar, so they
// do not stay in the browser history or get copied along with the page address.
const linkParams = new URLSearchParams(window.location.search);
const resetEmail = linkParams.get("email") || "";
const resetToken = linkParams.get("token") || "";
window.history.replaceState(null, "", window.location.pathname);

const resetForm = document.getElementById("resetForm");
const resetErrorBox = document.getElementById("resetError");

if (!resetEmail || !resetToken) {
  resetForm.classList.add("d-none");
  document.getElementById("resetIntro").classList.add("d-none");
  resetErrorBox.textContent = "Bu bağlantı eksik ya da bozuk. E-postandaki bağlantıyı yeniden aç ya da yeni bir bağlantı iste.";
  resetErrorBox.classList.remove("d-none");
}

resetForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const btnText = document.getElementById("resetBtnText");
  const spinner = document.getElementById("resetSpinner");
  resetErrorBox.classList.add("d-none");
  btnText.classList.add("d-none");
  spinner.classList.remove("d-none");

  try {
    await apiFetchAnonymous("/api/auth/reset-password", {
      method: "POST",
      body: {
        email: resetEmail,
        token: resetToken,
        newPassword: document.getElementById("newPassword").value,
        confirmNewPassword: document.getElementById("confirmPassword").value
      }
    });

    // The server has ended every session of this account, including one this browser may still hold.
    clearSession();

    resetForm.classList.add("d-none");
    document.getElementById("resetIntro").classList.add("d-none");
    document.getElementById("resetHelp").classList.add("d-none");
    document.getElementById("resetDone").classList.remove("d-none");
  } catch (err) {
    resetErrorBox.textContent = err.message || "Şifre değiştirilemedi.";
    resetErrorBox.classList.remove("d-none");
  } finally {
    btnText.classList.remove("d-none");
    spinner.classList.add("d-none");
  }
});
</script>

</body>
</html>
