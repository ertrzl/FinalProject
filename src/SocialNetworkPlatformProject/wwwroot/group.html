<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grup | SocialNet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>
</head>
<body>

<nav id="siteNav" data-active="groups"></nav>

<div class="container py-4" style="max-width: 760px;">

  <div id="groupLoading" class="text-center text-muted small py-5">Yükleniyor...</div>

  <div id="groupContent" class="d-none">

    <div class="profile-cover position-relative mb-3" id="groupCover"></div>

    <div class="d-flex flex-wrap align-items-start justify-content-between gap-3 mb-3">
      <div>
        <h1 class="h4 mb-1 fw-bold" id="groupName"></h1>
        <div class="text-muted small mb-2">
          <i class="bi bi-people-fill me-1"></i><span id="groupMemberCount">0</span> üye ·
          <i class="bi" id="groupPrivacyIcon"></i> <span id="groupPrivacyLabel"></span>
        </div>
        <p class="mb-0" id="groupDescription"></p>
      </div>
      <div class="d-flex gap-2 flex-shrink-0">
        <button type="button" class="btn btn-light border rounded-pill" data-bs-toggle="modal" data-bs-target="#groupMembersModal"><i class="bi bi-people me-1"></i>Üyeler</button>
        <div class="d-flex gap-2" id="groupActionArea"></div>
      </div>
    </div>

    <hr class="mb-4">

    <ul class="nav nav-pills gap-2 mb-3 d-none" id="groupTabs">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#groupTabPosts">Gönderiler</button></li>
      <li class="nav-item"><button class="nav-link text-muted" data-bs-toggle="pill" data-bs-target="#groupTabEvents" onclick="loadGroupEvents()">Etkinlikler</button></li>
    </ul>

    <div class="tab-content">
    <div class="tab-pane fade show active" id="groupTabPosts">

    <!-- Composer, only shown to members -->
    <div class="card border-0 shadow-sm rounded-4 p-3 mb-4 composer d-none" id="groupComposerWrap">
      <div class="d-flex gap-3">
        <img id="composerAvatar" src="images/default-avatar.png" class="avatar-sm flex-shrink-0 nav-profile-avatar" alt="">
        <textarea id="composerText" class="form-control" rows="2" placeholder="Grupta ne paylaşmak istersin?"></textarea>
      </div>
      <div class="d-none mt-3 position-relative" id="composerPreview">
        <button type="button" class="btn btn-dark btn-sm rounded-circle position-absolute top-0 end-0 m-2" onclick="clearComposerImage()"><i class="bi bi-x"></i></button>
        <img id="composerPreviewImg" src="" alt="" class="rounded-3 w-100 d-none" style="max-height:260px; object-fit:cover;">
        <video id="composerPreviewVideo" src="" class="rounded-3 w-100 d-none" style="max-height:260px; object-fit:cover;" controls></video>
      </div>
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mt-3 pt-3 border-top">
        <label class="attach-label m-0">
          <i class="bi bi-image"></i> Fotoğraf/Video Ekle
          <input type="file" id="composerFile" class="d-none" accept="image/*,video/*" onchange="previewComposerImage(this)">
        </label>
        <button type="button" id="composerSubmitBtn" class="btn btn-primary btn-sm rounded-pill px-3" onclick="publishGroupPost(this)">Paylaş</button>
      </div>
    </div>

    <div id="groupNonMemberNotice" class="alert alert-light border small d-none">Bu grubun gönderilerini görmek/paylaşmak için üye olman gerekiyor.</div>

    <div id="groupPostsList"></div>

    </div>

    <div class="tab-pane fade" id="groupTabEvents">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="text-muted small">Sadece grup üyelerinin gördüğü etkinlikler</div>
        <button class="btn btn-primary btn-sm rounded-pill d-none" id="groupEventCreateBtn" onclick="createGroupEvent()"><i class="bi bi-plus-lg me-1"></i>Etkinlik Oluştur</button>
      </div>
      <div id="groupEventsList"><div class="text-muted small">Yükleniyor...</div></div>
    </div>
    </div>

  </div>

  <div class="modal fade" id="groupMembersModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content rounded-4">
        <div class="modal-header">
          <h5 class="modal-title">Üyeler</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="groupJoinRequestsSection" class="d-none mb-3 pb-3 border-bottom">
            <div class="fw-bold small text-muted mb-2">BEKLEYEN İSTEKLER</div>
            <div id="groupJoinRequestsList"></div>
          </div>
          <div id="groupInviteSection" class="d-none mb-3 pb-3 border-bottom">
            <div class="fw-bold small text-muted mb-2">KULLANICI DAVET ET</div>
            <div class="d-flex align-items-center bg-body-tertiary rounded-pill px-3 py-2 mb-2">
              <i class="bi bi-search text-muted me-2"></i>
              <input type="text" id="groupInviteSearchInput" class="form-control form-control-sm border-0 bg-transparent p-0 shadow-none" placeholder="İsim veya kullanıcı adı ara..." oninput="searchInviteCandidates(this.value)">
            </div>
            <div id="groupInviteResultsList"></div>
          </div>
          <div id="groupMembersList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Admin-only: edit name/description/privacy/cover -->
  <div class="modal fade" id="editGroupModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Grubu Düzenle</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-semibold small">Grup Adı</label>
            <input type="text" id="editGroupName" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Açıklama</label>
            <textarea id="editGroupDescription" class="form-control" rows="3"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Gizlilik</label>
            <select id="editGroupPrivacy" class="form-select">
              <option value="Public">🌐 Genel</option>
              <option value="Private">🔒 Gizli</option>
            </select>
          </div>
          <div class="mb-1">
            <label class="form-label fw-semibold small">Kapak Fotoğrafı</label>
            <input type="file" id="editGroupCoverInput" class="form-control" accept="image/*">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light rounded-pill" data-bs-dismiss="modal">Vazgeç</button>
          <button type="button" class="btn btn-primary rounded-pill" onclick="saveGroupEdit()">Kaydet</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div id="chatDock" class="chat-dock">
  <div class="chat-dock-bar" onclick="toggleChatDockList()">
    <i class="bi bi-chat-dots-fill"></i> Sohbetler
  </div>
  <div class="chat-dock-list d-none" id="chatDockList"></div>
</div>
<div id="chatPopups" class="chat-popups"></div>

<script src="js/navbar.js"></script>
<script src="js/app.js"></script>
<script src="js/navbar-badge.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<script src="js/realtime.js"></script>
<script src="js/navbar-search.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.21.3/index.js"></script>
<script src="js/chat-data.js"></script>
<script src="js/chat-composer.js"></script>
<script src="js/chat-dock.js"></script>
<script src="js/pager.js"></script>
<script src="js/post-card.js"></script>
<script src="js/live-posts.js"></script>
<script src="js/location-autocomplete.js"></script>
<script src="js/event-form.js"></script>
<script src="js/user-search.js"></script>
<script src="js/group.js"></script>
</body>
</html>
