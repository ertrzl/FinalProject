<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etkinlikler | SocialNet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>
</head>
<body>

<nav id="siteNav" data-active="events"></nav>

<div class="container py-4" style="max-width: 980px;">

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h1 class="h4 mb-0 fw-bold">Etkinlikler</h1>
    <button class="btn btn-primary rounded-pill" onclick="openEventModal()"><i class="bi bi-plus-lg me-1"></i>Etkinlik Oluştur</button>
  </div>

  <ul class="nav nav-pills gap-2 mb-4">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#panel-upcoming">Yaklaşan</button></li>
    <li class="nav-item"><button class="nav-link text-muted" data-bs-toggle="pill" data-bs-target="#panel-going">Katıldıklarım</button></li>
    <li class="nav-item"><button class="nav-link text-muted" data-bs-toggle="pill" data-bs-target="#panel-mine">Etkinliklerim</button></li>
    <li class="nav-item"><button class="nav-link text-muted" data-bs-toggle="pill" data-bs-target="#panel-invites">Davetler (<span id="invitesCount">0</span>)</button></li>
  </ul>

  <div class="tab-content">

    <div class="tab-pane fade show active" id="panel-upcoming">
      <div class="d-flex flex-wrap gap-2 mb-3">
        <div class="d-flex align-items-center bg-body-tertiary rounded-pill px-3 py-2 flex-grow-1" style="min-width: 220px;">
          <i class="bi bi-search text-muted me-2"></i>
          <input type="text" id="eventSearch" maxlength="100" class="form-control form-control-sm border-0 bg-transparent p-0 shadow-none" placeholder="Etkinlik, konum veya açıklama ara..." oninput="onEventFilterChange(true)">
        </div>
        <select id="eventWhen" class="form-select form-select-sm rounded-pill w-auto" onchange="onEventFilterChange(false)">
          <option value="">Tüm tarihler</option>
          <option value="today">Bugün</option>
          <option value="week">Bu hafta</option>
          <option value="month">Bu ay</option>
        </select>
        <select id="eventFormat" class="form-select form-select-sm rounded-pill w-auto" onchange="onEventFilterChange(false)">
          <option value="">Yüz yüze ve çevrimiçi</option>
          <option value="inperson">Sadece yüz yüze</option>
          <option value="online">Sadece çevrimiçi</option>
        </select>
      </div>
      <div id="upcomingGrid" class="row g-3"><div class="text-muted small">Yükleniyor...</div></div>
      <div class="text-center mt-3 d-none" id="upcomingMoreWrap">
        <button class="btn btn-light border rounded-pill" onclick="loadMoreUpcoming()">Daha fazla göster</button>
      </div>
      <div class="text-center text-muted small mt-2" id="upcomingCount"></div>
    </div>

    <div class="tab-pane fade" id="panel-going">
      <div id="goingGrid" class="row g-3"></div>
      <div class="text-center text-muted py-5 d-none" id="goingEmptyState">
        <i class="bi bi-calendar-heart" style="font-size: 42px;"></i>
        <p class="mt-2 mb-0">Katılacağın etkinlikler burada görünecek.</p>
      </div>
    </div>

    <div class="tab-pane fade" id="panel-invites">
      <div id="invitesGrid" class="row g-3"></div>
      <div class="text-center text-muted py-5 d-none" id="invitesEmptyState">
        <i class="bi bi-envelope-heart" style="font-size: 42px;"></i>
        <p class="mt-2 mb-0">Bekleyen davetin yok.</p>
      </div>
    </div>

    <div class="tab-pane fade" id="panel-mine">
      <ul class="nav nav-pills gap-2 mb-3">
        <li class="nav-item"><button class="nav-link active py-1 px-3 small" data-bs-toggle="pill" data-bs-target="#mine-created">Oluşturduklarım</button></li>
        <li class="nav-item"><button class="nav-link text-muted py-1 px-3 small" data-bs-toggle="pill" data-bs-target="#mine-past">Geçmiş Etkinliklerim</button></li>
      </ul>
      <div class="tab-content">
        <div class="tab-pane fade show active" id="mine-created">
          <div id="createdGrid" class="row g-3"></div>
          <div class="text-center text-muted py-5 d-none" id="createdEmptyState">
            <i class="bi bi-calendar-plus" style="font-size: 42px;"></i>
            <p class="mt-2 mb-0">Henüz bir etkinlik oluşturmadın.</p>
          </div>
        </div>
        <div class="tab-pane fade" id="mine-past">
          <div id="pastGrid" class="row g-3"></div>
          <div class="text-center text-muted py-5 d-none" id="pastEmptyState">
            <i class="bi bi-calendar-check" style="font-size: 42px;"></i>
            <p class="mt-2 mb-0">Katıldığın geçmiş etkinlikler burada görünecek.</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div id="chatDock" class="chat-dock">
  <div class="chat-dock-bar" onclick="toggleChatDockList()">
    <i class="bi bi-chat-dots-fill"></i> Sohbetler
  </div>
  <div class="chat-dock-list d-none" id="chatDockList"></div>
</div>
<div id="chatPopups" class="chat-popups"></div>

<script src="js/navbar.js"></script>
<script src="js/app.js"></script>
<script src="js/navbar-badge.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<script src="js/realtime.js"></script>
<script src="js/navbar-search.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.21.3/index.js"></script>
<script src="js/chat-data.js"></script>
<script src="js/chat-composer.js"></script>
<script src="js/chat-dock.js"></script>
<script src="js/location-autocomplete.js"></script>
<script src="js/event-form.js"></script>
<script src="js/events.js"></script>
</body>
</html>
