<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profilim | SocialNet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>
</head>
<body>

<nav class="navbar navbar-expand bg-white border-bottom sticky-top py-2">
  <div class="container-fluid px-4">
    <a class="navbar-brand fs-4" href="home.html">SocialNet</a>
    <form class="d-none d-md-flex align-items-center bg-body-tertiary rounded-pill px-3 py-2 mx-3 nav-search-wrap" style="max-width:380px; flex:1;" onsubmit="return submitSearch(this)">
      <i class="bi bi-search text-muted me-2"></i>
      <input type="text" class="form-control form-control-sm border-0 bg-transparent p-0 shadow-none" placeholder="Kullanıcı ara..." name="q">
    </form>
    <div class="d-flex align-items-center gap-1 ms-auto">
      <a href="home.html" class="nav-pill-link"><i class="bi bi-house-door-fill"></i>Ana Sayfa</a>
      <a href="friends.html" class="nav-pill-link"><i class="bi bi-people-fill"></i>Arkadaşlar</a>
      <a href="notifications.html" class="nav-pill-link">
        <i class="bi bi-bell-fill"></i>Bildirimler
        <span class="position-absolute top-0 end-0 badge rounded-pill bg-danger badge-count d-none">0</span>
      </a>
            <a href="messages.html" class="nav-pill-link"><i class="bi bi-chat-dots-fill"></i>Mesajlar</a>
      <a href="groups.html" class="nav-pill-link"><i class="bi bi-diagram-3-fill"></i>Gruplar</a>
      <a href="marketplace.html" class="nav-pill-link"><i class="bi bi-shop"></i>Marketplace</a>
      <a href="events.html" class="nav-pill-link"><i class="bi bi-calendar-event"></i>Etkinlikler</a>
      <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" title="Temayı Değiştir"><i class="bi bi-moon-stars-fill"></i></button>
      <div class="dropdown ms-2">
        <button class="btn p-0 border-0 bg-transparent" data-bs-toggle="dropdown">
          <img src="images/default-avatar.png" class="avatar-xs nav-profile-avatar" alt="Profilim">
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>Profilim</a></li>
          <li><a class="dropdown-item" href="saved.html"><i class="bi bi-bookmark me-2"></i>Kaydedilenler</a></li>
          <li><a class="dropdown-item" href="settings.html"><i class="bi bi-gear me-2"></i>Ayarlar</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="#" onclick="logout(); return false;"><i class="bi bi-box-arrow-right me-2"></i>Çıkış Yap</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4">

  <!-- F6: User profile page showing posts, friends list, and about info -->
  <div class="profile-cover position-relative" id="profileCover">
    <div class="position-absolute d-flex gap-2" style="bottom:14px; right:14px;" id="profileCoverEditBtn">
      <label class="btn btn-dark btn-sm rounded-pill d-flex align-items-center gap-1" style="opacity:.85;">
        <i class="bi bi-camera-fill"></i> Kapak Fotoğrafını Değiştir
        <input type="file" id="coverPhotoInput" class="d-none" accept="image/*" onchange="uploadCoverPhoto(this)">
      </label>
      <button type="button" class="btn btn-outline-light btn-sm rounded-pill d-none" id="removeCoverBtn" style="opacity:.85;" onclick="removeCoverPhoto()">
        <i class="bi bi-x-lg"></i> Kaldır
      </button>
    </div>
  </div>

  <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 px-2 px-md-3" style="margin-top: -60px;">
    <div class="d-flex align-items-end gap-3">
      <div class="position-relative flex-shrink-0 dropdown">
        <img id="profileAvatar" src="images/default-avatar.png" class="avatar-lg bg-white" alt="">
        <span id="profileOnlineDot" class="position-absolute bg-success border border-3 border-white rounded-circle" style="width:22px;height:22px;bottom:8px;left:8px;" title="Çevrimiçi"></span>
        <ul class="dropdown-menu shadow-sm rounded-3 p-1" style="min-width:210px;">
          <li>
            <label class="dropdown-item d-flex align-items-center gap-2 rounded-2 py-2 fw-semibold" style="cursor:pointer;">
              <i class="bi bi-camera-fill"></i> Profil resmi seç
              <input type="file" class="d-none" accept="image/*" onchange="uploadAvatarQuick(this)">
            </label>
          </li>
        </ul>
      </div>
      <div class="pb-2">
        <h1 class="h4 mb-0" id="profileName">&nbsp;</h1>
        <p class="mb-0 small text-muted"><span id="profileHandle"></span> · <span id="profileFriendCount">0</span> arkadaş</p>
      </div>
    </div>
    <div id="profileActionArea">
      <button class="btn btn-light btn-sm rounded-pill shadow-sm border mb-2" data-bs-toggle="modal" data-bs-target="#editProfileModal"><i class="bi bi-pencil-square me-1"></i>Profili Düzenle</button>
    </div>
  </div>

  <ul class="nav nav-tabs mb-4 mt-4">
    <li class="nav-item"><button class="nav-link active fw-semibold" data-bs-toggle="tab" data-bs-target="#tab-posts">Gönderiler</button></li>
    <li class="nav-item"><button class="nav-link fw-semibold text-muted" data-bs-toggle="tab" data-bs-target="#tab-friends">Arkadaşlar</button></li>
    <li class="nav-item"><button class="nav-link fw-semibold text-muted" data-bs-toggle="tab" data-bs-target="#tab-about">Hakkında</button></li>
    <li class="nav-item"><button class="nav-link fw-semibold text-muted" data-bs-toggle="tab" data-bs-target="#tab-photos">Fotoğraflar</button></li>
  </ul>

  <div class="tab-content">

    <!-- Posts tab -->
    <div class="tab-pane fade show active" id="tab-posts">
      <div class="row g-4">

        <!-- About summary -->
        <div class="col-lg-4">
          <div class="card border-0 shadow-sm rounded-4 p-3">
            <div class="fw-bold mb-3">Hakkında</div>
            <div id="aboutSummary"></div>
          </div>

          <div class="card border-0 shadow-sm rounded-4 p-3 mt-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <span class="fw-bold">Arkadaşlar</span>
              <a href="friends.html" class="text-primary small fw-semibold">Tümünü Gör</a>
            </div>
            <div id="friendsSummary" class="row row-cols-3 g-2 text-center"></div>
          </div>
        </div>

        <!-- User's posts -->
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm rounded-4 p-3 mb-4 composer" id="ownComposerWrap">
            <div class="d-flex gap-3">
              <img id="composerAvatar" src="images/default-avatar.png" class="avatar-sm flex-shrink-0" alt="">
              <textarea id="composerText" autocomplete="off" class="form-control" rows="2" placeholder="Aklında ne var?"></textarea>
            </div>
            <div class="d-none mt-3 position-relative" id="composerPreview">
              <button type="button" class="btn btn-dark btn-sm rounded-circle position-absolute top-0 end-0 m-2" onclick="clearComposerImage()"><i class="bi bi-x"></i></button>
              <img id="composerPreviewImg" src="" alt="" class="rounded-3 w-100" style="max-height:260px; object-fit:cover;">
            </div>
            <div class="d-flex align-items-center justify-content-between mt-3 pt-3 border-top">
              <div class="d-flex gap-2 align-items-center">
                <label class="attach-label m-0"><i class="bi bi-image"></i> Fotoğraf Ekle<input type="file" id="composerFile" class="d-none" accept="image/*" onchange="previewComposerImage(this)"></label>
                <select id="composerPrivacy" class="form-select form-select-sm privacy-select">
                  <option value="Public">🌐 Herkese Açık</option>
                  <option value="FriendsOnly">👥 Sadece Arkadaşlar</option>
                </select>
              </div>
              <button type="button" class="btn btn-primary btn-sm rounded-pill px-3" onclick="publishPost(this)">Paylaş</button>
            </div>
          </div>

          <div id="profilePostsList"><div class="text-muted small">Yükleniyor...</div></div>
        </div>
      </div>
    </div>

    <!-- Friends tab -->
    <div class="tab-pane fade" id="tab-friends">
      <div class="card border-0 shadow-sm rounded-4 p-3">
        <div class="fw-bold mb-3" id="friendsTabHeading">Arkadaşlar</div>
        <div id="friendsTabList" class="row row-cols-2 row-cols-md-4 g-3 text-center"></div>
        <a href="friends.html" class="btn btn-outline-primary rounded-pill mt-3 align-self-start">Arkadaş Listesini Yönet</a>
      </div>
    </div>

    <!-- About tab -->
    <div class="tab-pane fade" id="tab-about">
      <div class="card border-0 shadow-sm rounded-4 p-3" style="max-width:520px;">
        <div class="fw-bold mb-3">Hakkında</div>
        <div id="aboutFull"></div>
      </div>
    </div>

    <!-- Photos tab -->
    <div class="tab-pane fade" id="tab-photos">
      <div class="card border-0 shadow-sm rounded-4 p-3">
        <div class="fw-bold mb-3">Fotoğraflar</div>
        <div id="photosGrid" class="row row-cols-2 row-cols-md-4 g-2"></div>
      </div>
    </div>

  </div>
</div>

<!-- Edit profile modal -->
<div class="modal fade" id="editProfileModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Profili Düzenle</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex align-items-center gap-3 mb-4">
          <img id="editAvatarPreview" src="images/default-avatar.png" class="avatar-md" alt="">
          <div class="d-flex flex-column gap-1">
            <label class="avatar-upload-btn m-0">
              <i class="bi bi-camera me-1"></i>Profil Fotoğrafını Değiştir
              <input type="file" id="editAvatarInput" class="d-none" accept="image/*" onchange="previewEditAvatar(this)">
            </label>
            <button type="button" class="btn btn-link btn-sm text-danger p-0 text-start d-none" id="removeAvatarBtn" onclick="markAvatarForRemoval()">Fotoğrafı Kaldır</button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Ad Soyad</label>
          <input type="text" id="editFullName" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Biyografi</label>
          <textarea id="editBio" class="form-control" rows="3"></textarea>
        </div>
        <div class="row g-3">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold small">Konum</label>
            <input type="text" id="editLocation" class="form-control">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold small">Meslek</label>
            <input type="text" id="editOccupation" class="form-control">
          </div>
        </div>
        <div class="mb-1">
          <label class="form-label fw-semibold small">Eğitim</label>
          <input type="text" id="editEducation" class="form-control">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light rounded-pill" data-bs-dismiss="modal">Vazgeç</button>
        <button type="button" id="saveProfileBtn" class="btn btn-primary rounded-pill" onclick="saveProfile()">Kaydet</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div id="chatDock" class="chat-dock">
  <div class="chat-dock-bar" onclick="toggleChatDockList()">
    <i class="bi bi-chat-dots-fill"></i> Sohbetler
  </div>
  <div class="chat-dock-list d-none" id="chatDockList"></div>
</div>
<div id="chatPopups" class="chat-popups"></div>

<script src="js/app.js"></script>
<script src="js/navbar-badge.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<script src="js/realtime.js"></script>
<script src="js/live-posts.js"></script>
<script src="js/navbar-search.js"></script>
<script src="js/chat-data.js"></script>
<script src="js/chat-dock.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
