<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arama | SocialNet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>
</head>
<body>

<nav id="siteNav" data-active=""></nav>

<div class="container py-4" style="max-width: 700px;">

  <!-- F7: Search for users by name or username, plus a bonus post/hashtag search -->
  <div class="card border-0 shadow-sm rounded-4 p-3">
    <div class="fw-bold mb-3" id="searchHeading">Arama sonuçları</div>
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><button type="button" class="nav-link active" id="searchTabUsersBtn" onclick="switchSearchTab('users')">Kullanıcılar</button></li>
      <li class="nav-item"><button type="button" class="nav-link" id="searchTabPostsBtn" onclick="switchSearchTab('posts')">Gönderiler</button></li>
    </ul>
    <div id="searchResultsUsers"><div class="text-muted small">Bir kullanıcı adı yazarak arama yap.</div></div>
    <div id="searchResultsPosts" class="d-none"><div class="text-muted small">Bir kelime ya da #hashtag yazarak arama yap.</div></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div id="chatDock" class="chat-dock">
  <div class="chat-dock-bar" onclick="toggleChatDockList()">
    <i class="bi bi-chat-dots-fill"></i> Sohbetler
  </div>
  <div class="chat-dock-list d-none" id="chatDockList"></div>
</div>
<div id="chatPopups" class="chat-popups"></div>

<script src="js/navbar.js"></script>
<script src="js/app.js"></script>
<script src="js/navbar-badge.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<script src="js/realtime.js"></script>
<script src="js/navbar-search.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.21.3/index.js"></script>
<script src="js/chat-data.js"></script>
<script src="js/chat-composer.js"></script>
<script src="js/chat-dock.js"></script>
<script src="js/pager.js"></script>
<script src="js/search.js"></script>
</body>
</html>
