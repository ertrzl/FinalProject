<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arama | SocialNet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand bg-white border-bottom sticky-top py-2">
  <div class="container-fluid px-4">
    <a class="navbar-brand fs-4" href="home.html">SocialNet</a>
    <form class="d-none d-md-flex align-items-center bg-body-tertiary rounded-pill px-3 py-2 mx-3 nav-search-wrap" style="max-width:380px; flex:1;" onsubmit="return submitSearch(this)">
      <i class="bi bi-search text-muted me-2"></i>
      <input type="text" id="searchInput" class="form-control form-control-sm border-0 bg-transparent p-0 shadow-none" placeholder="Kullanıcı ara..." name="q" value="Jane">
    </form>
    <div class="d-flex align-items-center gap-1 ms-auto">
      <a href="home.html" class="nav-pill-link"><i class="bi bi-house-door-fill"></i>Ana Sayfa</a>
      <a href="friends.html" class="nav-pill-link"><i class="bi bi-people-fill"></i>Arkadaşlar</a>
      <a href="notifications.html" class="nav-pill-link">
        <i class="bi bi-bell-fill"></i>Bildirimler
        <span class="position-absolute top-0 end-0 badge rounded-pill bg-danger badge-count">3</span>
      </a>
            <a href="messages.html" class="nav-pill-link"><i class="bi bi-chat-dots-fill"></i>Mesajlar</a>
      <a href="groups.html" class="nav-pill-link"><i class="bi bi-diagram-3-fill"></i>Gruplar</a>
      <a href="marketplace.html" class="nav-pill-link"><i class="bi bi-shop"></i>Marketplace</a>
      <a href="events.html" class="nav-pill-link"><i class="bi bi-calendar-event"></i>Etkinlikler</a>
      <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" title="Temayı Değiştir"><i class="bi bi-moon-stars-fill"></i></button>
      <div class="dropdown ms-2">
        <button class="btn p-0 border-0 bg-transparent" data-bs-toggle="dropdown">
          <img src="https://i.pravatar.cc/80?img=45" class="avatar-xs" alt="Profilim">
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>Profilim</a></li>
          <li><a class="dropdown-item" href="saved.html"><i class="bi bi-bookmark me-2"></i>Kaydedilenler</a></li>
          <li><a class="dropdown-item" href="settings.html"><i class="bi bi-gear me-2"></i>Ayarlar</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="index.html"><i class="bi bi-box-arrow-right me-2"></i>Çıkış Yap</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4" style="max-width: 700px;">

  <!-- F7: Search for users by name or username -->
  <div class="card border-0 shadow-sm rounded-4 p-3">
    <div class="fw-bold mb-3" id="searchHeading">"Jane" için arama sonuçları</div>

    <div class="d-flex align-items-center gap-3 p-3 border-bottom">
      <img src="https://i.pravatar.cc/120?img=25" class="avatar-md" alt="">
      <div class="flex-grow-1">
        <div class="fw-bold"><a href="profile.html?name=Jane%20Doe&avatar=https%3A%2F%2Fi.pravatar.cc%2F100%3Fimg%3D25" class="text-dark text-decoration-none">Jane Doe</a></div>
        <div class="text-muted small">@jane.doe · 4 ortak arkadaş</div>
      </div>
      <button class="btn btn-outline-primary btn-sm rounded-pill" onclick="toggleFriendRequest(this)">Arkadaş Ekle</button>
    </div>

    <div class="d-flex align-items-center gap-3 p-3 border-bottom">
      <img src="https://i.pravatar.cc/120?img=44" class="avatar-md" alt="">
      <div class="flex-grow-1">
        <div class="fw-bold"><a href="profile.html?name=Jane%20Smith&avatar=https%3A%2F%2Fi.pravatar.cc%2F100%3Fimg%3D44" class="text-dark text-decoration-none">Jane Smith</a></div>
        <div class="text-muted small">@jane.smith · 1 ortak arkadaş</div>
      </div>
      <button class="btn btn-outline-primary btn-sm rounded-pill" onclick="toggleFriendRequest(this)">Arkadaş Ekle</button>
    </div>

    <div class="d-flex align-items-center gap-3 p-3">
      <img src="https://i.pravatar.cc/120?img=36" class="avatar-md" alt="">
      <div class="flex-grow-1">
        <div class="fw-bold"><a href="profile.html?name=Janet%20Kim&avatar=https%3A%2F%2Fi.pravatar.cc%2F100%3Fimg%3D36" class="text-dark text-decoration-none">Janet Kim</a></div>
        <div class="text-muted small">@janet.kim · Ortak arkadaş yok</div>
      </div>
      <button class="btn btn-outline-primary btn-sm rounded-pill" onclick="toggleFriendRequest(this)">Arkadaş Ekle</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div id="chatDock" class="chat-dock">
  <div class="chat-dock-bar" onclick="toggleChatDockList()">
    <i class="bi bi-chat-dots-fill"></i> Sohbetler
  </div>
  <div class="chat-dock-list d-none" id="chatDockList"></div>
</div>
<div id="chatPopups" class="chat-popups"></div>

<script src="js/app.js"></script>
<script src="js/chat-data.js"></script>
<script src="js/chat-dock.js"></script>
<script>
  const q = new URLSearchParams(window.location.search).get("q");
  if (q) {
    document.getElementById("searchInput").value = q;
    document.getElementById("searchHeading").textContent = `"${q}" için arama sonuçları`;
  }
</script>
</body>
</html>
