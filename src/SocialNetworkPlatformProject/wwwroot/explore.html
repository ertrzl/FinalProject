<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keşfet | SocialNet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>
</head>
<body>

<nav id="siteNav" data-active="explore"></nav>

<div class="container py-4" style="max-width: 760px;">

  <h1 class="h4 fw-bold mb-1"><i class="bi bi-compass-fill text-primary me-2"></i>Keşfet</h1>
  <p class="text-muted small mb-3">Son bir haftada en çok konuşulanlar.</p>

  <!-- The hashtags used most this week; each one opens its search results -->
  <div class="card border-0 shadow-sm rounded-4 p-3 mb-4">
    <div class="fw-bold mb-2">Gündemdeki etiketler</div>
    <div id="trendingTags" class="d-flex flex-wrap gap-2"><span class="text-muted small">Yükleniyor...</span></div>
  </div>

  <!-- People you may know -->
  <div class="card border-0 shadow-sm rounded-4 p-3 mb-4">
    <div class="fw-bold mb-3">Tanışabileceğin kişiler</div>
    <div id="suggestionsList"><div class="text-muted small">Yükleniyor...</div></div>
  </div>

  <!-- The most liked and commented posts of the week -->
  <div class="fw-bold mb-3">Popüler gönderiler</div>
  <div id="popularList">
    <div class="text-center text-muted small py-4">Yükleniyor...</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div id="chatDock" class="chat-dock">
  <div class="chat-dock-bar" onclick="toggleChatDockList()">
    <i class="bi bi-chat-dots-fill"></i> Sohbetler
  </div>
  <div class="chat-dock-list d-none" id="chatDockList"></div>
</div>
<div id="chatPopups" class="chat-popups"></div>

<script src="js/navbar.js"></script>
<script src="js/app.js"></script>
<script src="js/navbar-badge.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<script src="js/realtime.js"></script>
<script src="js/pager.js"></script>
<script src="js/post-card.js"></script>
<script src="js/mention-autocomplete.js"></script>
<script src="js/live-posts.js"></script>
<script src="js/navbar-search.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.21.3/index.js"></script>
<script src="js/chat-data.js"></script>
<script src="js/chat-composer.js"></script>
<script src="js/chat-dock.js"></script>
<script src="js/suggestions.js"></script>
<script src="js/explore.js"></script>
</body>
</html>
