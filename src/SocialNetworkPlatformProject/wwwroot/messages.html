<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<title>Mesajlar | Stoop</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/inbox.css">
<script src="js/design.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
</head>
<body>

<nav id="siteNav" data-active="messages"></nav>
<h1 class="visually-hidden">Mesajlar</h1>

<div class="container py-4">
  <div class="card border-0 shadow-sm rounded-4 overflow-hidden messages-card">
    <div class="row g-0 h-100" id="messagesLayout">

      <div class="col-12 col-md-4 col-lg-3 border-end h-100 d-flex flex-column messages-list-col">
        <div class="p-3 border-bottom">
          <div class="d-flex align-items-center justify-content-between gap-2 mb-2">
            <div class="fw-bold fs-5">Mesajlar</div>
            <button type="button" class="btn btn-primary btn-sm rounded-pill flex-shrink-0" onclick="openNewChatGroup()"><i class="bi bi-people-fill me-1"></i>Yeni grup</button>
          </div>
          <label class="conv-search inbox-only">
            <span class="kbd" aria-hidden="true">/</span>
            <input type="text" id="conversationSearch" placeholder="Konuşmalarda ara..." aria-label="Konuşmalarda ara" autocomplete="off" oninput="filterConversations()">
          </label>
        </div>
        <div id="conversationList" class="flex-grow-1 overflow-auto"></div>
      </div>

      <div class="col-12 col-md-8 col-lg-9 h-100 d-flex flex-column messages-thread-col">
        <div class="p-3 border-bottom d-flex align-items-center gap-2" id="conversationHeader"></div>
        <div class="flex-grow-1 overflow-auto p-3" id="conversationThread"></div>
        <form class="p-3 border-top d-none" id="messageForm"></form>
      </div>

    </div>
  </div>
</div>

<div class="modal fade" id="newChatGroupModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content rounded-4">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Yeni grup</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex align-items-center gap-3 mb-3">
          <label class="chat-group-picker flex-shrink-0 m-0" title="Grup resmi seç">
            <img id="newChatGroupPreview" class="d-none" alt="">
            <i class="bi bi-camera-fill" id="newChatGroupCamera" aria-hidden="true"></i>
            <input type="file" id="newChatGroupAvatar" class="d-none" accept="image/*">
          </label>
          <div class="flex-grow-1">
            <label class="form-label small fw-semibold mb-1" for="newChatGroupTitle">Grubun adı</label>
            <input type="text" id="newChatGroupTitle" class="form-control" maxlength="60" autocomplete="off" placeholder="Örn. Hafta sonu planı">
          </div>
        </div>
        <label class="form-label small fw-semibold mb-1" for="newChatGroupSearch">Arkadaşlarını seç <span class="text-muted fw-normal" id="newChatGroupCount"></span></label>
        <input type="search" id="newChatGroupSearch" class="form-control mb-2" autocomplete="off" placeholder="Arkadaşlarında ara...">
        <div id="newChatGroupFriends" class="chat-group-friends"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light rounded-pill" data-bs-dismiss="modal">Vazgeç</button>
        <button type="button" class="btn btn-primary rounded-pill" id="newChatGroupCreate" onclick="createChatGroup()" disabled>Oluştur</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="chatGroupInfoModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content rounded-4">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Grup bilgisi</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
      </div>
      <div class="modal-body" id="chatGroupInfoBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/navbar.js"></script>
<script src="js/app.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/navbar-badge.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<script src="js/realtime.js"></script>
<script src="js/navbar-search.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.21.3/index.js"></script>
<script src="js/chat-data.js"></script>
<script src="js/chat-composer.js"></script>
<script src="js/chat-groups.js"></script>
<script src="js/messages.js"></script>
</body>
</html>
