<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkadaşlar | SocialNet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>
</head>
<body>

<nav class="navbar navbar-expand bg-white border-bottom sticky-top py-2">
  <div class="container-fluid px-4">
    <a class="navbar-brand fs-4" href="home.html">SocialNet</a>
    <form class="d-none d-md-flex align-items-center bg-body-tertiary rounded-pill px-3 py-2 mx-3 nav-search-wrap" style="max-width:380px; flex:1;" onsubmit="return submitSearch(this)">
      <i class="bi bi-search text-muted me-2"></i>
      <input type="text" class="form-control form-control-sm border-0 bg-transparent p-0 shadow-none" placeholder="Kullanıcı ara..." name="q">
    </form>
    <div class="d-flex align-items-center gap-1 ms-auto">
      <a href="home.html" class="nav-pill-link"><i class="bi bi-house-door-fill"></i>Ana Sayfa</a>
      <a href="friends.html" class="nav-pill-link active"><i class="bi bi-people-fill"></i>Arkadaşlar</a>
      <a href="notifications.html" class="nav-pill-link">
        <i class="bi bi-bell-fill"></i>Bildirimler
        <span class="position-absolute top-0 end-0 badge rounded-pill bg-danger badge-count d-none">0</span>
      </a>
            <a href="messages.html" class="nav-pill-link"><i class="bi bi-chat-dots-fill"></i>Mesajlar</a>
      <a href="groups.html" class="nav-pill-link"><i class="bi bi-diagram-3-fill"></i>Gruplar</a>
      <a href="marketplace.html" class="nav-pill-link"><i class="bi bi-shop"></i>Marketplace</a>
      <a href="events.html" class="nav-pill-link"><i class="bi bi-calendar-event"></i>Etkinlikler</a>
      <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" title="Temayı Değiştir"><i class="bi bi-moon-stars-fill"></i></button>
      <div class="dropdown ms-2">
        <button class="btn p-0 border-0 bg-transparent" data-bs-toggle="dropdown">
          <img src="images/default-avatar.png" class="avatar-xs nav-profile-avatar" alt="Profilim">
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>Profilim</a></li>
          <li><a class="dropdown-item" href="saved.html"><i class="bi bi-bookmark me-2"></i>Kaydedilenler</a></li>
          <li><a class="dropdown-item" href="settings.html"><i class="bi bi-gear me-2"></i>Ayarlar</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="#" onclick="logout(); return false;"><i class="bi bi-box-arrow-right me-2"></i>Çıkış Yap</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4" style="max-width: 820px;">

  <!-- F2: Friend request system — send, accept, and decline connections -->
  <ul class="nav nav-pills gap-2 mb-4 flex-wrap">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#panel-requests">Gelen İstekler (<span id="incomingCount">0</span>)</button></li>
    <li class="nav-item"><button class="nav-link text-muted" data-bs-toggle="pill" data-bs-target="#panel-sent">Gönderilen İstekler</button></li>
    <li class="nav-item"><button class="nav-link text-muted" data-bs-toggle="pill" data-bs-target="#panel-all">Arkadaşlarım (<span id="friendsCount">0</span>)</button></li>
    <li class="nav-item"><button class="nav-link text-muted" data-bs-toggle="pill" data-bs-target="#panel-suggestions">Öneriler</button></li>
  </ul>

  <div class="tab-content">

    <!-- Incoming requests -->
    <div class="tab-pane fade show active" id="panel-requests">
      <div class="card border-0 shadow-sm rounded-4 p-3">
        <div class="fw-bold mb-3">Gelen Arkadaşlık İstekleri</div>
        <div id="incomingRequestsList"><div class="text-muted small">Yükleniyor...</div></div>
      </div>
    </div>

    <!-- Sent requests -->
    <div class="tab-pane fade" id="panel-sent">
      <div class="card border-0 shadow-sm rounded-4 p-3">
        <div class="fw-bold mb-3">Gönderilen İstekler</div>
        <div id="sentRequestsList"><div class="text-muted small">Yükleniyor...</div></div>
      </div>
    </div>

    <!-- All friends -->
    <div class="tab-pane fade" id="panel-all">
      <div class="card border-0 shadow-sm rounded-4 p-3">
        <div class="fw-bold mb-3">Tüm Arkadaşlar</div>
        <div id="friendsList" class="row g-3"><div class="text-muted small">Yükleniyor...</div></div>
      </div>
    </div>

    <!-- Suggestions -->
    <div class="tab-pane fade" id="panel-suggestions">
      <div class="card border-0 shadow-sm rounded-4 p-3">
        <div class="fw-bold mb-3">Tanıyor Olabilirsin</div>
        <div id="suggestionsList" class="row g-3"><div class="text-muted small">Yükleniyor...</div></div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div id="chatDock" class="chat-dock">
  <div class="chat-dock-bar" onclick="toggleChatDockList()">
    <i class="bi bi-chat-dots-fill"></i> Sohbetler
  </div>
  <div class="chat-dock-list d-none" id="chatDockList"></div>
</div>
<div id="chatPopups" class="chat-popups"></div>

<script src="js/app.js"></script>
<script src="js/navbar-badge.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<script src="js/realtime.js"></script>
<script src="js/navbar-search.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.21.3/index.js"></script>
<script src="js/chat-data.js"></script>
<script src="js/chat-composer.js"></script>
<script src="js/chat-dock.js"></script>
<script src="js/friends.js"></script>
</body>
</html>
