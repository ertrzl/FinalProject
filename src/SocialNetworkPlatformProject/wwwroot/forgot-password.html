<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şifremi Unuttum | SocialNet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>
</head>
<body>

<!-- Asks for the address the password reset link is sent to; the link opens reset-password.html -->
<div class="auth-gradient d-flex align-items-center justify-content-center p-3">
  <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5" style="max-width: 420px; width:100%;">
    <div class="text-center mb-4">
      <div class="auth-logo">SocialNet</div>
      <p class="text-muted small mb-0" id="forgotIntro">Şifreni mi unuttun? E-posta adresini yaz, sana bir sıfırlama bağlantısı gönderelim.</p>
    </div>

    <div id="forgotError" class="alert alert-danger py-2 small d-none"></div>

    <form id="forgotForm">
      <div class="mb-4">
        <label for="email" class="form-label fw-semibold small">E-posta</label>
        <input type="email" class="form-control" id="email" placeholder="ornek@mail.com" autocomplete="email" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">
        <span id="forgotBtnText">Bağlantı Gönder</span>
        <span id="forgotSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
      </button>
    </form>

    <div id="forgotDone" class="d-none text-center">
      <i class="bi bi-envelope-check text-primary" style="font-size: 2.5rem;"></i>
      <p class="fw-semibold mt-2 mb-1">E-postanı kontrol et</p>
      <p class="text-muted small mb-3">Bu adresle kayıtlı bir hesap varsa şifre sıfırlama bağlantısı gönderildi. Gelmediyse spam klasörüne bak; bir dakika sonra yeniden de isteyebilirsin.</p>
      <button type="button" class="btn btn-link btn-sm p-0" id="forgotRetry">Başka bir adres dene</button>
    </div>

    <p class="text-center text-muted small mt-4 mb-0">
      <a href="index.html" class="text-primary fw-semibold">Giriş sayfasına dön</a>
    </p>
  </div>
</div>

<script>
const forgotForm = document.getElementById("forgotForm");
const forgotIntro = document.getElementById("forgotIntro");
const forgotDone = document.getElementById("forgotDone");

forgotForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const errorBox = document.getElementById("forgotError");
  const btnText = document.getElementById("forgotBtnText");
  const spinner = document.getElementById("forgotSpinner");
  errorBox.classList.add("d-none");
  btnText.classList.add("d-none");
  spinner.classList.remove("d-none");

  try {
    await apiFetchAnonymous("/api/auth/forgot-password", {
      method: "POST",
      body: { email: document.getElementById("email").value.trim() }
    });

    forgotForm.classList.add("d-none");
    forgotIntro.classList.add("d-none");
    forgotDone.classList.remove("d-none");
  } catch (err) {
    errorBox.textContent = err.message || "İstek gönderilemedi.";
    errorBox.classList.remove("d-none");
  } finally {
    btnText.classList.remove("d-none");
    spinner.classList.add("d-none");
  }
});

document.getElementById("forgotRetry").addEventListener("click", () => {
  forgotDone.classList.add("d-none");
  forgotIntro.classList.remove("d-none");
  forgotForm.classList.remove("d-none");
  document.getElementById("email").select();
});
</script>

</body>
</html>
