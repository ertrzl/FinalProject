<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayıt Ol | SocialNet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- F1: User registration with profile photo, bio, and personal details -->
<div class="auth-gradient d-flex align-items-center justify-content-center p-3 py-5">
  <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5" style="max-width: 560px; width:100%;">
    <div class="text-center mb-4">
      <div class="auth-logo">SocialNet</div>
      <p class="text-muted small mb-0">Dijital kimliğini oluştur, ağını büyüt.</p>
    </div>

    <form action="home.html">

      <div class="d-flex align-items-center gap-3 mb-4">
        <img id="avatarPreview" class="avatar-md" src="https://i.pravatar.cc/150?img=45" alt="Profil fotoğrafı">
        <label class="avatar-upload-btn m-0">
          <i class="bi bi-camera me-1"></i> Profil Fotoğrafı Seç
          <input type="file" class="d-none" accept="image/*" onchange="previewAvatar(this)">
        </label>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold small">Ad Soyad</label>
          <input type="text" class="form-control" placeholder="Ada Lovelace" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold small">Kullanıcı Adı</label>
          <input type="text" class="form-control" placeholder="ada.lovelace" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold small">E-posta</label>
          <input type="email" class="form-control" placeholder="ornek@mail.com" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold small">Doğum Tarihi</label>
          <input type="date" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold small">Şifre</label>
          <input type="password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold small">Konum</label>
          <input type="text" class="form-control" placeholder="İstanbul, Türkiye">
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold small">Hakkında / Biyografi</label>
          <textarea class="form-control" rows="3" placeholder="Kendinden kısaca bahset..."></textarea>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold mt-4">Hesap Oluştur</button>
    </form>

    <p class="text-center text-muted small mt-4 mb-0">
      Zaten hesabın var mı? <a href="index.html" class="text-primary fw-semibold">Giriş Yap</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
