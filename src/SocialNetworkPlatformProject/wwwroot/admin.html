<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Yönetim | Stoop</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/inbox.css">
<script src="js/design.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
</head>
<body>

<nav id="siteNav" data-active="admin"></nav>

<div class="container py-4" style="max-width: 980px;">
<div class="page-split page-solo">
  <div class="page-head"><div><h1 class="h4 fw-bold mb-4">Yönetim</h1><p class="inbox-only">Şikâyetler, hesaplar, içerik ve yapılan işlemlerin kaydı. Burada yapılan her şey “Kayıtlar” sekmesine yazılır.</p></div></div>
  <div class="page-main">

  <ul class="nav nav-pills gap-2 mb-4 admin-tabs">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#panel-overview">Genel</button></li>
    <li class="nav-item"><button class="nav-link text-muted" data-bs-toggle="pill" data-bs-target="#panel-reports" id="reportsTab">Şikâyetler <span class="badge bg-danger d-none" id="pendingBadge">0</span></button></li>
    <li class="nav-item"><button class="nav-link text-muted" data-bs-toggle="pill" data-bs-target="#panel-users">Kullanıcılar</button></li>
    <li class="nav-item"><button class="nav-link text-muted" data-bs-toggle="pill" data-bs-target="#panel-content">İçerik</button></li>
    <li class="nav-item"><button class="nav-link text-muted" data-bs-toggle="pill" data-bs-target="#panel-audit">Kayıtlar</button></li>
  </ul>

  <div class="tab-content">

    <!-- Overview -->
    <div class="tab-pane fade show active" id="panel-overview">
      <div id="statsGrid" class="row g-3"><div class="text-muted small">Yükleniyor...</div></div>
    </div>

    <!-- Reports -->
    <div class="tab-pane fade" id="panel-reports">
      <div class="d-flex flex-wrap gap-2 mb-3">
        <select id="reportStatus" class="form-select rounded-pill w-auto">
          <option value="Pending">Bekleyenler</option>
          <option value="Resolved">Çözülenler</option>
          <option value="Dismissed">Reddedilenler</option>
          <option value="">Hepsi</option>
        </select>
      </div>
      <div id="reportList"><div class="text-muted small">Yükleniyor...</div></div>
    </div>

    <!-- Users -->
    <div class="tab-pane fade" id="panel-users">
      <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <input type="search" id="userTerm" class="form-control rounded-pill admin-search" placeholder="İsim, kullanıcı adı ya da e-posta ara..." autocomplete="off">
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" id="userSuspendedOnly">
          <label class="form-check-label small" for="userSuspendedOnly">Sadece askıdakiler</label>
        </div>
      </div>
      <div id="userList"><div class="text-muted small">Yükleniyor...</div></div>
    </div>

    <!-- Content -->
    <div class="tab-pane fade" id="panel-content">
      <div class="d-flex flex-wrap gap-2 mb-3">
        <select id="contentType" class="form-select rounded-pill w-auto">
          <option value="post">Gönderiler</option>
          <option value="comment">Yorumlar</option>
          <option value="listing">İlanlar</option>
          <option value="event">Etkinlikler</option>
          <option value="group">Gruplar</option>
        </select>
        <input type="search" id="contentTerm" class="form-control rounded-pill admin-search" placeholder="Metin ya da başlık ara..." autocomplete="off">
      </div>
      <div id="contentList"><div class="text-muted small">Yükleniyor...</div></div>
    </div>

    <!-- Audit log -->
    <div class="tab-pane fade" id="panel-audit">
      <div class="d-flex flex-wrap gap-2 mb-3">
        <select id="auditAction" class="form-select rounded-pill w-auto">
          <option value="">Tüm işlemler</option>
          <option value="report.resolve">Şikâyet çözüldü</option>
          <option value="report.dismiss">Şikâyet reddedildi</option>
          <option value="user.suspend">Hesap askıya alındı</option>
          <option value="user.unsuspend">Askı kaldırıldı</option>
          <option value="user.delete">Hesap silindi</option>
          <option value="post.remove">Gönderi kaldırıldı</option>
          <option value="comment.remove">Yorum kaldırıldı</option>
          <option value="listing.remove">İlan kaldırıldı</option>
          <option value="event.remove">Etkinlik kaldırıldı</option>
          <option value="group.remove">Grup kaldırıldı</option>
        </select>
        <input type="search" id="auditTerm" class="form-control rounded-pill admin-search" placeholder="Yönetici ya da ayrıntı ara..." autocomplete="off">
      </div>
      <div id="auditList"><div class="text-muted small">Yükleniyor...</div></div>
    </div>

  </div>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div id="chatDock" class="chat-dock">
  <div class="chat-dock-bar" onclick="toggleChatDockList()">
    <i class="bi bi-chat-dots-fill"></i> Sohbetler
  </div>
  <div class="chat-dock-list d-none" id="chatDockList"></div>
</div>
<div id="chatPopups" class="chat-popups"></div>

<script src="js/navbar.js"></script>
<script src="js/app.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/navbar-badge.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<script src="js/realtime.js"></script>
<script src="js/navbar-search.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.21.3/index.js"></script>
<script src="js/chat-data.js"></script>
<script src="js/chat-composer.js"></script>
<script src="js/chat-dock.js"></script>
<script src="js/pager.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
