<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace | SocialNet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>
</head>
<body>

<nav class="navbar navbar-expand bg-white border-bottom sticky-top py-2">
  <div class="container-fluid px-4">
    <a class="navbar-brand fs-4" href="home.html">SocialNet</a>
    <form class="d-none d-md-flex align-items-center bg-body-tertiary rounded-pill px-3 py-2 mx-3 nav-search-wrap" style="max-width:380px; flex:1;" onsubmit="return submitSearch(this)">
      <i class="bi bi-search text-muted me-2"></i>
      <input type="text" class="form-control form-control-sm border-0 bg-transparent p-0 shadow-none" placeholder="Kullanıcı ara..." name="q">
    </form>
    <div class="d-flex align-items-center gap-1 ms-auto">
      <a href="home.html" class="nav-pill-link"><i class="bi bi-house-door-fill"></i>Ana Sayfa</a>
      <a href="friends.html" class="nav-pill-link"><i class="bi bi-people-fill"></i>Arkadaşlar</a>
      <a href="notifications.html" class="nav-pill-link">
        <i class="bi bi-bell-fill"></i>Bildirimler
        <span class="position-absolute top-0 end-0 badge rounded-pill bg-danger badge-count d-none">0</span>
      </a>
      <a href="messages.html" class="nav-pill-link"><i class="bi bi-chat-dots-fill"></i>Mesajlar</a>
      <a href="groups.html" class="nav-pill-link"><i class="bi bi-diagram-3-fill"></i>Gruplar</a>
      <a href="marketplace.html" class="nav-pill-link active"><i class="bi bi-shop"></i>Marketplace</a>
      <a href="events.html" class="nav-pill-link"><i class="bi bi-calendar-event"></i>Etkinlikler</a>
      <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" title="Temayı Değiştir"><i class="bi bi-moon-stars-fill"></i></button>
      <div class="dropdown ms-2">
        <button class="btn p-0 border-0 bg-transparent" data-bs-toggle="dropdown">
          <img src="images/default-avatar.png" class="avatar-xs nav-profile-avatar" alt="Profilim">
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>Profilim</a></li>
          <li><a class="dropdown-item" href="saved.html"><i class="bi bi-bookmark me-2"></i>Kaydedilenler</a></li>
          <li><a class="dropdown-item" href="settings.html"><i class="bi bi-gear me-2"></i>Ayarlar</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="#" onclick="logout(); return false;"><i class="bi bi-box-arrow-right me-2"></i>Çıkış Yap</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="row g-4">

    <!-- Filters -->
    <aside class="col-lg-3 side-nav">
      <div class="card border-0 shadow-sm rounded-4 p-3">
        <button class="btn btn-primary w-100 rounded-pill mb-3" data-bs-toggle="modal" data-bs-target="#sellModal"><i class="bi bi-plus-lg me-1"></i>Ürün Sat</button>

        <div class="mb-3">
          <div class="d-flex align-items-center bg-body-tertiary rounded-pill px-3 py-2">
            <i class="bi bi-search text-muted me-2"></i>
            <input type="text" id="marketSearch" class="form-control form-control-sm border-0 bg-transparent p-0 shadow-none" placeholder="Ürün ara..." oninput="renderListings()">
          </div>
        </div>

        <div class="fw-bold small text-muted mb-2">KATEGORİLER</div>
        <div id="categoryList" class="d-flex flex-column gap-1"></div>
      </div>
    </aside>

    <!-- Listings grid -->
    <main class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h5 fw-bold mb-0">Marketplace</h1>
        <div class="text-muted small" id="resultCount"></div>
      </div>
      <div class="row g-3" id="listingsGrid"></div>
    </main>

  </div>
</div>

<!-- Sell modal -->
<div class="modal fade" id="sellModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Ürün Sat</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3 text-center">
          <div class="d-none position-relative mb-2" id="sellPreviewWrap">
            <img id="sellPreviewImg" src="" class="w-100 rounded-3" style="max-height:180px;object-fit:cover;" alt="">
          </div>
          <label class="avatar-upload-btn m-0 d-inline-block">
            <i class="bi bi-camera me-1"></i>Fotoğraf Ekle
            <input type="file" id="sellImageInput" class="d-none" accept="image/*" onchange="previewSellImage(this)">
          </label>
        </div>
        <div class="mb-3 d-none" id="sellError"></div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Ürün Adı</label>
          <input type="text" id="sellTitle" class="form-control" placeholder="Örn. Bisiklet">
        </div>
        <div class="row g-3 mb-3">
          <div class="col-6">
            <label class="form-label fw-semibold small">Fiyat (₺)</label>
            <input type="number" id="sellPrice" class="form-control" placeholder="0">
          </div>
          <div class="col-6">
            <label class="form-label fw-semibold small">Kategori</label>
            <select id="sellCategory" class="form-select">
              <option>Elektronik</option>
              <option>Ev Eşyası</option>
              <option>Giyim</option>
              <option>Kitap</option>
              <option>Spor</option>
              <option>Araç</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Konum</label>
          <input type="text" id="sellLocation" class="form-control" placeholder="İstanbul, Türkiye">
        </div>
        <div class="mb-1">
          <label class="form-label fw-semibold small">Açıklama</label>
          <textarea id="sellDescription" class="form-control" rows="3" placeholder="Ürün hakkında bilgi ver..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light rounded-pill" data-bs-dismiss="modal">Vazgeç</button>
        <button type="button" class="btn btn-primary rounded-pill" onclick="publishListing()">Yayınla</button>
      </div>
    </div>
  </div>
</div>

<!-- Listing detail modal -->
<div class="modal fade" id="listingModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="listingModalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-6">
            <img id="listingModalImage" src="" class="w-100 rounded-3" style="max-height:280px;object-fit:cover;" alt="">
          </div>
          <div class="col-md-6">
            <div class="fs-4 fw-bold text-primary mb-2" id="listingModalPrice"></div>
            <div class="text-muted small mb-3" id="listingModalMeta"></div>
            <p id="listingModalDescription"></p>
            <hr>
            <div class="d-flex align-items-center gap-2 mb-3">
              <img id="listingModalSellerAvatar" src="" class="avatar-sm" alt="">
              <div>
                <div class="fw-bold small">Satıcı</div>
                <div class="small" id="listingModalSellerName"></div>
              </div>
            </div>
            <a id="listingModalMessageLink" href="#" class="btn btn-primary rounded-pill w-100 mb-2"><i class="bi bi-chat-dots-fill me-1"></i>Satıcıya Mesaj Gönder</a>
            <button id="listingModalDeleteBtn" type="button" class="btn btn-outline-danger rounded-pill w-100 d-none" onclick="deleteListing()">İlanı Kaldır</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div id="chatDock" class="chat-dock">
  <div class="chat-dock-bar" onclick="toggleChatDockList()">
    <i class="bi bi-chat-dots-fill"></i> Sohbetler
  </div>
  <div class="chat-dock-list d-none" id="chatDockList"></div>
</div>
<div id="chatPopups" class="chat-popups"></div>

<script src="js/app.js"></script>
<script src="js/navbar-badge.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<script src="js/realtime.js"></script>
<script src="js/navbar-search.js"></script>
<script src="js/chat-data.js"></script>
<script src="js/chat-dock.js"></script>
<script src="js/marketplace.js"></script>
</body>
</html>
