<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<title>Ana Sayfa | Stoop</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/inbox.css">
<script src="js/design.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
</head>
<body>

<nav id="siteNav" data-active="home"></nav>
<h1 class="visually-hidden">Ana Sayfa</h1>

<div class="container-fluid px-3 px-lg-4 py-4">
  <div class="row g-4 page-row">

    <!-- Side navigation (the inbox design has it in the menu on the left) -->
    <aside class="col-lg-3 d-none d-lg-block side-nav ps-0 classic-only">
      <div class="p-2">
        <a href="home.html" class="side-nav-link active"><i class="bi bi-house-door-fill"></i><span>Ana Sayfa</span></a>
        <a href="profile.html" class="side-nav-link"><i class="bi bi-person-fill"></i><span>Profilim</span></a>
        <a href="friends.html" class="side-nav-link"><i class="bi bi-people-fill"></i><span>Arkadaşlar</span></a>
        <a href="messages.html" class="side-nav-link"><i class="bi bi-chat-dots-fill"></i><span>Mesajlar</span></a>
        <a href="groups.html" class="side-nav-link"><i class="bi bi-diagram-3-fill"></i><span>Gruplar</span></a>
        <a href="marketplace.html" class="side-nav-link"><i class="bi bi-shop"></i><span>Marketplace</span></a>
        <a href="events.html" class="side-nav-link"><i class="bi bi-calendar-event"></i><span>Etkinlikler</span></a>
        <a href="games.html" class="side-nav-link"><i class="bi bi-controller"></i><span>Oyunlar</span></a>
        <a href="notifications.html" class="side-nav-link"><i class="bi bi-bell-fill"></i><span>Bildirimler</span></a>
        <a href="saved.html" class="side-nav-link"><i class="bi bi-bookmark-fill"></i><span>Kaydedilenler</span></a>
        <a href="settings.html" class="side-nav-link"><i class="bi bi-gear-fill"></i><span>Ayarlar</span></a>
        <a href="search.html" class="side-nav-link"><i class="bi bi-search"></i><span>Ara</span></a>
      </div>
    </aside>

    <!-- Main feed -->
    <main class="col-lg-6 page-main">

      <!-- Stories -->
      <div class="d-flex gap-2 overflow-auto pb-2 mb-3 story-strip">
        <div class="story-card" data-bs-toggle="modal" data-bs-target="#addStoryModal">
          <img src="images/default-avatar.png" class="nav-profile-avatar" alt="">
          <span class="story-name">Hikayen</span>
        </div>
        <div id="storyBarDynamic" class="d-flex gap-2"></div>
      </div>

      <!-- Story viewer (fullscreen) -->
      <div class="story-viewer d-none" id="storyViewer">
       <div class="story-stage">
        <!-- Wide screens: the previous person's story on the left, the next person's on the right (dimmed; click one to go there) -->
        <div class="story-side story-side-prev" id="storySidePrev" role="button" tabindex="0" aria-label="Önceki kişinin hikâyesi" onclick="goStoryGroup(-1)"></div>
        <button type="button" class="story-arrow" id="storyArrowPrev" aria-label="Önceki hikâye" onclick="prevStory()"><i class="bi bi-chevron-left"></i></button>
        <div class="story-viewer-inner" id="storyViewerInner">
          <div class="story-viewer-bars" id="storyBars"></div>
          <div class="story-viewer-header">
            <img id="storyViewerAvatar" class="avatar-xs" src="" alt="">
            <a id="storyViewerName" class="fw-bold text-white small text-decoration-none"></a>
            <span id="storyViewerAge" class="small text-white-50"></span>
            <div class="ms-auto d-flex align-items-center gap-2">
              <!-- Only on your own stories: who watched it, and delete -->
              <button type="button" id="storyViewersBtn" class="btn btn-sm btn-dark rounded-pill d-none" onclick="openStoryViewers()"><i class="bi bi-eye me-1"></i><span id="storyViewCount">0</span><i class="bi bi-heart-fill text-danger ms-2 me-1"></i><span id="storyLikeCount">0</span></button>
              <button type="button" id="storyDeleteBtn" class="btn btn-sm btn-dark rounded-circle d-none" title="Hikâyeyi sil" onclick="deleteCurrentStory()"><i class="bi bi-trash"></i></button>
              <button type="button" class="btn-close btn-close-white" onclick="closeStory()"></button>
            </div>
          </div>
          <img id="storyViewerImage" class="story-viewer-image" src="" alt="">
          <video id="storyViewerVideo" class="story-viewer-image d-none" muted playsinline></video>
          <audio id="storyMusic" preload="auto" loop></audio>
          <!-- Under the header, each only when there is one: whose story this was (a reshared story), the song (title, artist, mute button) and the tagged people -->
          <div class="story-info-stack" id="storyInfoStack">
            <a class="story-chip d-none" id="storyResharedChip" data-no-i18n></a>
            <div class="story-music-chip d-none" id="storyMusicChip">
              <img id="storyMusicArt" class="story-music-art d-none" src="" alt="">
              <i class="bi bi-music-note-beamed" id="storyMusicIcon"></i>
              <span class="story-music-text" id="storyMusicText"></span>
              <button type="button" class="story-music-mute" id="storyMusicMute" aria-label="Sesi kapat" onclick="toggleStoryMusicMute()"><i class="bi bi-volume-up-fill"></i></button>
            </div>
            <div class="story-tags-row d-none" id="storyTagsRow" data-no-i18n></div>
          </div>
          <div class="story-loading d-none" id="storyLoading"><div class="spinner-border text-light" role="status" aria-label="Yükleniyor"></div></div>
          <div class="story-viewer-nav">
            <div class="story-nav-zone" onclick="prevStory()"></div>
            <div class="story-nav-zone" onclick="nextStory()"></div>
          </div>
          <!-- Only on somebody else's story: a reply that goes to their messages, and the heart -->
          <form class="story-reply-bar d-none" id="storyReplyBar" onsubmit="return sendStoryReply(event)">
            <div class="story-reply-field">
              <input type="text" id="storyReplyInput" maxlength="2000" autocomplete="off" placeholder="Mesaj gönder..." aria-label="Mesaj gönder"
                     onfocus="pauseStory()" onblur="resumeStory()" oninput="updateStoryReplyButton()">
              <button type="submit" id="storyReplySend" class="story-reply-send d-none" aria-label="Gönder"><i class="bi bi-send-fill"></i></button>
            </div>
            <button type="button" id="storyLikeBtn" class="story-like-btn" aria-label="Beğen" onclick="toggleStoryLike()"><i class="bi bi-heart"></i></button>
          </form>
          <!-- Only for a tagged person: put this story on your own story -->
          <button type="button" class="story-reshare-btn d-none" id="storyReshareBtn" onclick="reshareCurrentStory()"><i class="bi bi-plus-circle-fill me-2"></i>Hikayene ekle</button>
          <div class="story-viewers-panel d-none" id="storyViewersPanel">
            <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom border-secondary">
              <span class="fw-bold small"><i class="bi bi-eye me-1"></i>Görüntüleyenler</span>
              <button type="button" class="btn-close btn-close-white btn-sm" onclick="closeStoryViewers()"></button>
            </div>
            <div id="storyViewersList" class="story-viewers-list"></div>
          </div>
        </div>
        <button type="button" class="story-arrow" id="storyArrowNext" aria-label="Sonraki hikâye" onclick="nextStory()"><i class="bi bi-chevron-right"></i></button>
        <div class="story-side story-side-next" id="storySideNext" role="button" tabindex="0" aria-label="Sonraki kişinin hikâyesi" onclick="goStoryGroup(1)"></div>
       </div>
      </div>

      <!-- Add story modal -->
      <div class="modal fade" id="addStoryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content rounded-4">
            <div class="modal-header">
              <h5 class="modal-title fw-bold">Hikaye Ekle</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
              <div class="d-none mb-3" id="addStoryPreviewWrap">
                <img id="addStoryPreviewImg" src="" class="w-100 rounded-3" style="max-height:280px;object-fit:cover;" alt="">
                <video id="addStoryPreviewVideo" src="" class="w-100 rounded-3 d-none" style="max-height:280px;" controls muted></video>
              </div>
              <label class="avatar-upload-btn m-0 d-inline-block">
                <i class="bi bi-camera me-1"></i>Fotoğraf veya Video Seç
                <input type="file" id="addStoryFileInput" class="d-none" accept="image/*,video/*" onchange="previewNewStory(this)">
              </label>
              <div class="mt-3 text-start">
                <div class="d-flex flex-wrap gap-2">
                  <button type="button" class="btn btn-light border rounded-pill btn-sm" id="addStoryMusicBtn" onclick="toggleStoryMusicSearch()"><i class="bi bi-music-note-beamed me-1"></i>Müzik ekle</button>
                  <button type="button" class="btn btn-light border rounded-pill btn-sm" id="addStoryTagBtn" onclick="toggleStoryTagPicker()"><i class="bi bi-at me-1"></i>Birini etiketle</button>
                </div>
                <div class="story-music-picked d-none" id="addStoryMusicChosen">
                  <i class="bi bi-music-note-beamed"></i>
                  <span class="flex-grow-1 text-truncate" id="addStoryMusicChosenText"></span>
                  <button type="button" class="btn-close btn-sm" aria-label="Müziği kaldır" onclick="removeStoryMusic()"></button>
                </div>
                <div class="d-none mt-2" id="addStoryMusicPanel">
                  <input type="search" id="addStoryMusicInput" class="form-control" maxlength="80" autocomplete="off" placeholder="Şarkı veya sanatçı ara..." aria-label="Şarkı veya sanatçı ara" oninput="searchStoryMusicSoon()">
                  <div class="story-music-results" id="addStoryMusicResults"></div>
                </div>
                <div class="story-tag-chosen d-none" id="addStoryTagChosen" data-no-i18n></div>
                <div class="d-none mt-2" id="addStoryTagPanel">
                  <input type="search" id="addStoryTagInput" class="form-control" maxlength="80" autocomplete="off" placeholder="Arkadaşlarında ara..." aria-label="Arkadaşlarında ara" oninput="drawStoryTagList()">
                  <div class="story-music-results" id="addStoryTagList" data-no-i18n></div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-light rounded-pill" data-bs-dismiss="modal">Vazgeç</button>
              <button type="button" class="btn btn-primary rounded-pill" onclick="publishStory()">Paylaş</button>
            </div>
          </div>
        </div>
      </div>

      <!-- F3: Post creation with text and optional image, scoped to public or friends -->
      <div class="card border-0 shadow-sm rounded-4 p-3 mb-4 composer">
        <div class="d-flex gap-3">
          <img id="composerAvatar" src="images/default-avatar.png" class="avatar-sm flex-shrink-0 nav-profile-avatar" alt="">
          <textarea id="composerText" autocomplete="off" data-mention class="form-control" rows="2" placeholder="Aklında ne var?"></textarea>
        </div>

        <div class="d-none mt-3" id="composerPreview"></div>

        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mt-3 pt-3 border-top">
          <div class="d-flex gap-2 align-items-center flex-wrap">
            <label class="attach-label m-0">
              <i class="bi bi-image"></i> Fotoğraf/Video Ekle
              <input type="file" id="composerFile" class="d-none" accept="image/*,video/*" multiple onchange="addComposerFiles(this)">
            </label>
            <select id="composerPrivacy" class="form-select form-select-sm privacy-select">
              <option value="Public">🌐 Herkese Açık</option>
              <option value="FriendsOnly">👥 Sadece Arkadaşlar</option>
            </select>
          </div>
          <button type="button" id="composerSubmitBtn" class="btn btn-primary btn-sm rounded-pill px-3" onclick="publishPost(this)">Paylaş</button>
        </div>
      </div>

      <!-- Inbox design: filter the posts shown below by kind (filterFeed in feed.js) -->
      <div class="nav nav-pills inbox-only" id="feedFilter" role="tablist">
        <button type="button" class="nav-link active" data-filter="" onclick="filterFeed(this)">Hepsi</button>
        <button type="button" class="nav-link" data-filter="photo" onclick="filterFeed(this)">Fotoğraf</button>
        <button type="button" class="nav-link" data-filter="poll" onclick="filterFeed(this)">Anket</button>
      </div>

      <!-- F4: News feed showing posts from connected users in chronological order -->
      <div id="feedList">
        <div id="feedLoading" class="text-center text-muted small py-4">Akış yükleniyor...</div>
      </div>

    </main>

    <!-- Right rail: suggestions -->
    <aside class="col-lg-3 d-none d-lg-block side-nav page-aside">
      <div class="card border-0 shadow-sm rounded-4 p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="fw-bold">Arkadaşlık Önerileri</span>
        </div>
        <div id="suggestionsList"><div class="text-muted small">Yükleniyor...</div></div>
      </div>

      <!-- Inbox design: the next event the person goes to (js/upcoming-widget.js) -->
      <div class="inbox-only" id="upcomingWidget"></div>
    </aside>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div id="chatDock" class="chat-dock">
  <div class="chat-dock-bar" onclick="toggleChatDockList()">
    <i class="bi bi-chat-dots-fill"></i> Sohbetler
  </div>
  <div class="chat-dock-list d-none" id="chatDockList"></div>
</div>
<div id="chatPopups" class="chat-popups"></div>

<script src="js/navbar.js"></script>
<script src="js/app.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/navbar-badge.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<script src="js/realtime.js"></script>
<script src="js/pager.js"></script>
<script src="js/post-card.js"></script>
<script src="js/mention-autocomplete.js"></script>
<script src="js/live-posts.js"></script>
<script src="js/navbar-search.js"></script>
<script src="js/suggestions.js"></script>
<script src="js/upcoming-widget.js"></script>
<script src="js/feed.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.21.3/index.js"></script>
<script src="js/chat-data.js"></script>
<script src="js/chat-composer.js"></script>
<script src="js/chat-dock.js"></script>
<script src="js/stories.js"></script>
</body>
</html>
