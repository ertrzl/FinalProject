<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<title>Kayıt Ol | Stoop</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/inbox.css">
<script src="js/design.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/password-toggle.js"></script>
</head>
<body>

<div class="auth-gradient d-flex align-items-center justify-content-center p-3 py-5">
  <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5" style="max-width: 560px; width:100%;">
    <div class="text-center mb-4">
      <h1 class="visually-hidden">Kayıt Ol</h1>
      <div class="auth-logo">Stoop</div>
      <p class="text-muted small mb-0">Dijital kimliğini oluştur, ağını büyüt.</p>
    </div>

    <div id="registerError" class="alert alert-danger py-2 small d-none"></div>

    <form id="registerForm">

      <div class="d-flex align-items-center gap-3 mb-4">
        <img id="avatarPreview" class="avatar-md" src="images/default-avatar.png" alt="Profil fotoğrafı">
        <label class="avatar-upload-btn m-0">
          <i class="bi bi-camera me-1"></i> Profil Fotoğrafı Seç
          <input type="file" id="avatarInput" class="d-none" accept="image/*" onchange="previewAvatar(this)">
        </label>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold small" for="fullName">Ad Soyad</label>
          <input type="text" id="fullName" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold small" for="userName">Kullanıcı Adı</label>
          <input type="text" id="userName" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold small" for="email">E-posta</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold small" for="birthDate">Doğum Tarihi</label>
          <input type="date" id="birthDate" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold small" for="password">Şifre</label>
          <input type="password" id="password" class="form-control" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold mt-4">
        <span id="registerBtnText">Hesap Oluştur</span>
        <span id="registerSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
      </button>
    </form>

    <p class="text-center text-muted small mt-4 mb-0">
      Zaten hesabın var mı? <a href="index.html" class="text-primary fw-semibold">Giriş Yap</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
if (getSession()) window.location.href = "home.html";

document.getElementById("registerForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const errorBox = document.getElementById("registerError");
  const btnText = document.getElementById("registerBtnText");
  const spinner = document.getElementById("registerSpinner");
  errorBox.classList.add("d-none");
  btnText.classList.add("d-none");
  spinner.classList.remove("d-none");

  try {
    const formData = new FormData();
    formData.append("fullName", document.getElementById("fullName").value.trim());
    formData.append("userName", document.getElementById("userName").value.trim());
    formData.append("email", document.getElementById("email").value.trim());
    formData.append("password", document.getElementById("password").value);

    const birthDate = document.getElementById("birthDate").value;
    if (birthDate) formData.append("birthDate", birthDate);

    const avatarFile = document.getElementById("avatarInput").files[0];
    if (avatarFile) formData.append("avatar", avatarFile);

    const tokenResponse = await apiFetchForm("/api/auth/register", {
      method: "POST",
      body: formData
    });

    saveSession(tokenResponse);
    window.location.href = "home.html";
  } catch (err) {
    errorBox.textContent = err.message || "Kayıt oluşturulamadı.";
    errorBox.classList.remove("d-none");
    btnText.classList.remove("d-none");
    spinner.classList.add("d-none");
  }
});
</script>
</body>
</html>
