<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<title>Etkinlik | Stoop</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/inbox.css">
<script src="js/design.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
</head>
<body>

<nav id="siteNav" data-active="events"></nav>

<div class="container py-4" style="max-width: 860px;">
<div class="page-split page-solo">
<div class="page-main">

  <a href="events.html" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left me-1"></i>Etkinlikler</a>

  <div id="eventLoading" class="text-muted small mt-3">Yükleniyor...</div>
  <div id="eventPageError" class="alert alert-danger mt-3 d-none"></div>

  <div id="eventPage" class="d-none mt-3">

    <div id="evInviteBanner" class="alert alert-info d-none d-flex flex-wrap align-items-center justify-content-between gap-2">
      <div><i class="bi bi-envelope-heart me-1"></i><b id="evInvitedBy"></b> seni bu etkinliğe davet etti.</div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary btn-sm rounded-pill" onclick="answerInvite(true)">Katılıyorum</button>
        <button class="btn btn-light border btn-sm rounded-pill" onclick="answerInvite(false)">Reddet</button>
      </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-3">
      <img id="evCover" class="w-100" style="height:240px;object-fit:cover;" alt="">
      <div class="p-4">
        <div class="text-danger fw-bold small mb-1" id="evDate"></div>
        <h1 class="h3 fw-bold mb-2" id="evTitle"></h1>
        <div class="text-muted mb-1" id="evLocation"></div>
        <div class="text-muted small mb-3" id="evCounts"></div>
        <div class="small mb-2 d-none" id="evGroup"></div>
        <div class="d-flex align-items-center gap-2 mb-3" id="evOrganizer"></div>
        <div class="d-flex flex-wrap gap-2" id="evActions"></div>
      </div>
    </div>

    <ul class="nav nav-pills gap-2 mb-3 ev-tabs" id="evTabs">
      <li class="nav-item"><button type="button" class="nav-link active" data-bs-toggle="pill" data-bs-target="#evPane-about">Detaylar</button></li>
      <li class="nav-item"><button type="button" class="nav-link text-muted" data-bs-toggle="pill" data-bs-target="#evPane-discussion">Tartışma</button></li>
      <li class="nav-item"><button type="button" class="nav-link text-muted" id="evPhotosTab" data-bs-toggle="pill" data-bs-target="#evPane-photos">Fotoğraflar (0)</button></li>
      <li class="nav-item d-none" id="evAttendanceTabItem"><button type="button" class="nav-link text-muted" id="evAttendanceTab" data-bs-toggle="pill" data-bs-target="#evPane-attendance">Yoklama</button></li>
    </ul>

    <div class="tab-content">

    <div class="tab-pane fade show active" id="evPane-about"><div>

    <div class="card border-0 shadow-sm rounded-4 p-4 mb-3" id="evAboutCard">
      <h2 class="h6 fw-bold mb-2">Hakkında</h2>
      <div id="evDescription" data-no-i18n class="text-break" style="white-space: pre-wrap;"></div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 mb-3 d-none" id="evMapCard">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <h2 class="h6 fw-bold mb-0">Harita</h2>
        <a id="evDirections" class="btn btn-light border btn-sm rounded-pill ev-touch" href="#" target="_blank" rel="noopener noreferrer"><i class="bi bi-sign-turn-right me-1"></i>Yol tarifi</a>
      </div>
      <div id="evMap" class="event-map"></div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 mb-3">
      <h2 class="h6 fw-bold mb-3">Katılımcılar</h2>
      <div id="evAttendees"><div class="text-muted small">Yükleniyor...</div></div>
    </div>

    </div></div>

    <div class="tab-pane fade" id="evPane-discussion"><div>

    <div class="card border-0 shadow-sm rounded-4 p-4 mb-3">
      <h2 class="h6 fw-bold mb-3">Tartışma</h2>
      <div class="mb-3">
        <textarea id="evCommentText" class="form-control" rows="2" maxlength="1000" placeholder="Bir şey yaz..."></textarea>
        <div class="d-flex align-items-center justify-content-between mt-2 flex-wrap gap-2">
          <div class="form-check form-switch d-none" id="evAnnouncementWrap">
            <input class="form-check-input" type="checkbox" id="evAnnouncementToggle">
            <label class="form-check-label small" for="evAnnouncementToggle">Duyuru olarak paylaş (katılanlara bildirim gider)</label>
          </div>
          <button class="btn btn-primary btn-sm rounded-pill px-3 ms-auto" id="evCommentBtn" onclick="postComment()">Gönder</button>
        </div>
      </div>
      <div id="evComments"><div class="text-muted small">Yükleniyor...</div></div>
      <div class="text-center mt-2 d-none" id="evCommentsMoreWrap">
        <button class="btn btn-light border btn-sm rounded-pill" onclick="loadMoreComments()">Daha fazla göster</button>
      </div>
    </div>

    </div></div>

    <div class="tab-pane fade" id="evPane-photos"><div>

    <div class="card border-0 shadow-sm rounded-4 p-4 mb-3">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
        <h2 class="h6 fw-bold mb-0">Fotoğraflar</h2>
        <button type="button" class="btn btn-primary btn-sm rounded-pill ev-touch d-none" id="evPhotoAddBtn" onclick="document.getElementById('evPhotoInput').click()"><i class="bi bi-camera-fill me-1"></i>Fotoğraf Ekle</button>
        <input type="file" id="evPhotoInput" class="d-none" accept="image/*" multiple onchange="uploadEventPhotos(this)">
      </div>
      <div class="text-muted small mb-3" id="evPhotoInfo"></div>
      <div id="evPhotoGrid" class="ev-photo-grid"><div class="text-muted small">Yükleniyor...</div></div>
    </div>

    </div></div>

    <div class="tab-pane fade" id="evPane-attendance"><div>

    <div class="card border-0 shadow-sm rounded-4 p-4 mb-3">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
        <h2 class="h6 fw-bold mb-0">Yoklama</h2>
        <span class="badge text-bg-light border fs-6 fw-semibold" id="evCheckInCount"></span>
      </div>
      <div class="text-muted small mb-3" id="evCheckInInfo"></div>
      <div id="evCheckInList"><div class="text-muted small">Yükleniyor...</div></div>
    </div>

    </div></div>

    </div>

  </div>
</div>
</div>
</div>

<div class="modal fade" id="shareEventModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Gönderide Paylaş</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="shared-post small mb-3">
          <div class="fw-semibold text-break" id="shareEventTitle" data-no-i18n></div>
          <div class="text-muted" id="shareEventWhen" data-no-i18n></div>
        </div>
        <textarea id="shareEventText" data-mention class="form-control" rows="3" maxlength="5000" placeholder="Bir şey eklemek ister misin? (isteğe bağlı)"></textarea>
        <div class="mt-3">
          <label class="form-label small fw-semibold" for="shareEventPrivacy">Kimler görebilir?</label>
          <select id="shareEventPrivacy" class="form-select form-select-sm rounded-pill">
            <option value="Public">Herkese Açık</option>
            <option value="FriendsOnly">Sadece Arkadaşlar</option>
          </select>
        </div>
        <div class="text-danger small mt-2 d-none" id="shareEventError"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light rounded-pill" data-bs-dismiss="modal">Vazgeç</button>
        <button type="button" class="btn btn-primary rounded-pill" id="shareEventSend" onclick="submitEventShare()">Paylaş</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="inviteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content rounded-4">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Davet Et</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex align-items-center bg-body-tertiary rounded-pill px-3 py-2 mb-2">
          <i class="bi bi-search text-muted me-2"></i>
          <input type="text" id="inviteSearchInput" class="form-control form-control-sm border-0 bg-transparent p-0 shadow-none" placeholder="İsim veya kullanıcı adı ara..." oninput="searchInviteCandidates(this.value)">
        </div>
        <div class="text-muted small mb-2 d-none" id="inviteGroupNote">Bu bir grup etkinliği: sadece grubun üyeleri davet edilebilir.</div>
        <div id="inviteResults"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div id="chatDock" class="chat-dock">
  <div class="chat-dock-bar" onclick="toggleChatDockList()">
    <i class="bi bi-chat-dots-fill"></i> Sohbetler
  </div>
  <div class="chat-dock-list d-none" id="chatDockList"></div>
</div>
<div id="chatPopups" class="chat-popups"></div>

<script src="js/navbar.js"></script>
<script src="js/app.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/navbar-badge.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<script src="js/realtime.js"></script>
<script src="js/navbar-search.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.21.3/index.js"></script>
<script src="js/chat-data.js"></script>
<script src="js/chat-composer.js"></script>
<script src="js/chat-dock.js"></script>
<script src="js/location-autocomplete.js"></script>
<script src="js/event-form.js"></script>
<script src="js/user-search.js"></script>
<script src="js/mention-autocomplete.js"></script>
<script src="js/event.js"></script>
</body>
</html>
