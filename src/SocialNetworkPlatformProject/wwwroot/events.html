<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etkinlikler | SocialNet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>
</head>
<body>

<nav class="navbar navbar-expand bg-white border-bottom sticky-top py-2">
  <div class="container-fluid px-4">
    <a class="navbar-brand fs-4" href="home.html">SocialNet</a>
    <form class="d-none d-md-flex align-items-center bg-body-tertiary rounded-pill px-3 py-2 mx-3 nav-search-wrap" style="max-width:380px; flex:1;" onsubmit="return submitSearch(this)">
      <i class="bi bi-search text-muted me-2"></i>
      <input type="text" class="form-control form-control-sm border-0 bg-transparent p-0 shadow-none" placeholder="Kullanıcı ara..." name="q">
    </form>
    <div class="d-flex align-items-center gap-1 ms-auto">
      <a href="home.html" class="nav-pill-link"><i class="bi bi-house-door-fill"></i>Ana Sayfa</a>
      <a href="friends.html" class="nav-pill-link"><i class="bi bi-people-fill"></i>Arkadaşlar</a>
      <a href="notifications.html" class="nav-pill-link">
        <i class="bi bi-bell-fill"></i>Bildirimler
        <span class="position-absolute top-0 end-0 badge rounded-pill bg-danger badge-count d-none">0</span>
      </a>
      <a href="messages.html" class="nav-pill-link"><i class="bi bi-chat-dots-fill"></i>Mesajlar</a>
      <a href="groups.html" class="nav-pill-link"><i class="bi bi-diagram-3-fill"></i>Gruplar</a>
      <a href="marketplace.html" class="nav-pill-link"><i class="bi bi-shop"></i>Marketplace</a>
      <a href="events.html" class="nav-pill-link active"><i class="bi bi-calendar-event"></i>Etkinlikler</a>
      <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" title="Temayı Değiştir"><i class="bi bi-moon-stars-fill"></i></button>
      <div class="dropdown ms-2">
        <button class="btn p-0 border-0 bg-transparent" data-bs-toggle="dropdown">
          <img src="images/default-avatar.png" class="avatar-xs nav-profile-avatar" alt="Profilim">
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>Profilim</a></li>
          <li><a class="dropdown-item" href="saved.html"><i class="bi bi-bookmark me-2"></i>Kaydedilenler</a></li>
          <li><a class="dropdown-item" href="settings.html"><i class="bi bi-gear me-2"></i>Ayarlar</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="#" onclick="logout(); return false;"><i class="bi bi-box-arrow-right me-2"></i>Çıkış Yap</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4" style="max-width: 980px;">

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h1 class="h4 mb-0 fw-bold">Etkinlikler</h1>
    <button class="btn btn-primary rounded-pill" data-bs-toggle="modal" data-bs-target="#createEventModal"><i class="bi bi-plus-lg me-1"></i>Etkinlik Oluştur</button>
  </div>

  <ul class="nav nav-pills gap-2 mb-4">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#panel-upcoming">Yaklaşan</button></li>
    <li class="nav-item"><button class="nav-link text-muted" data-bs-toggle="pill" data-bs-target="#panel-going">Katıldıklarım</button></li>
  </ul>

  <div class="tab-content">

    <div class="tab-pane fade show active" id="panel-upcoming">
      <div id="upcomingGrid" class="row g-3"><div class="text-muted small">Yükleniyor...</div></div>
    </div>

    <div class="tab-pane fade" id="panel-going">
      <div id="goingGrid" class="row g-3"></div>
      <div class="text-center text-muted py-5 d-none" id="goingEmptyState">
        <i class="bi bi-calendar-heart" style="font-size: 42px;"></i>
        <p class="mt-2 mb-0">Katılacağın etkinlikler burada görünecek.</p>
      </div>
    </div>

  </div>
</div>

<!-- Create event modal -->
<div class="modal fade" id="createEventModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Etkinlik Oluştur</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3 d-none" id="eventError"></div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Etkinlik Adı</label>
          <input type="text" id="eventTitle" class="form-control" placeholder="Örn. Sahil Voleybolu">
        </div>
        <div class="row g-3 mb-3">
          <div class="col-6">
            <label class="form-label fw-semibold small">Tarih</label>
            <input type="date" id="eventDate" class="form-control">
          </div>
          <div class="col-6">
            <label class="form-label fw-semibold small">Saat</label>
            <input type="time" id="eventTime" class="form-control">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Konum</label>
          <input type="text" id="eventLocation" class="form-control" placeholder="Örn. Caddebostan Sahili">
        </div>
        <div class="mb-1">
          <label class="form-label fw-semibold small">Açıklama</label>
          <textarea id="eventDescription" class="form-control" rows="3" placeholder="Etkinlik hakkında bilgi ver..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light rounded-pill" data-bs-dismiss="modal">Vazgeç</button>
        <button type="button" class="btn btn-primary rounded-pill" onclick="publishEvent()">Oluştur</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div id="chatDock" class="chat-dock">
  <div class="chat-dock-bar" onclick="toggleChatDockList()">
    <i class="bi bi-chat-dots-fill"></i> Sohbetler
  </div>
  <div class="chat-dock-list d-none" id="chatDockList"></div>
</div>
<div id="chatPopups" class="chat-popups"></div>

<script src="js/app.js"></script>
<script src="js/navbar-badge.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<script src="js/realtime.js"></script>
<script src="js/navbar-search.js"></script>
<script src="js/chat-data.js"></script>
<script src="js/chat-dock.js"></script>
<script src="js/events.js"></script>
</body>
</html>
