<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş Yap | SocialNet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-gradient d-flex align-items-center justify-content-center p-3">
  <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5" style="max-width: 420px; width:100%;">
    <div class="text-center mb-4">
      <div class="auth-logo">SocialNet</div>
      <p class="text-muted small mb-0">Arkadaşlarınla bağlantıda kal.</p>
    </div>

    <form action="home.html">
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold small">E-posta veya kullanıcı adı</label>
        <input type="text" class="form-control" id="email" placeholder="ornek@mail.com" required>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label fw-semibold small">Şifre</label>
        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">Giriş Yap</button>
    </form>

    <p class="text-center text-muted small mt-4 mb-0">
      Hesabın yok mu? <a href="register.html" class="text-primary fw-semibold">Kayıt Ol</a>
    </p>
  </div>
</div>

</body>
</html>
