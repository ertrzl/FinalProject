<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<title>Oyun | Stoop</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/inbox.css">
<script src="js/design.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
</head>
<body>

<nav id="siteNav" data-active="games"></nav>

<div class="container py-4" style="max-width: 980px;">
<div class="page-split page-solo">
<div class="page-main">

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2 page-head">
    <h1 class="h4 mb-0 fw-bold" id="gameTitle">Oyun</h1>
    <a href="games.html" class="btn btn-light border rounded-pill"><i class="bi bi-arrow-left me-1"></i>Oyunlara dön</a>
  </div>

  <div class="xo-page">
    <div class="xo-game">

      <div class="text-muted small text-center py-5" id="gameLoading">Yükleniyor...</div>
      <div class="alert alert-danger d-none" id="gameError" role="alert"></div>

      <div class="d-none" id="gameView">
        <div class="xo-players" id="gamePlayers"></div>
        <div class="rps-scoreboard d-none" id="rpsScore" role="group"></div>
        <div class="xo-status" id="gameStatus" role="status" aria-live="polite"></div>
        <div class="xo-status-sub" id="gameSub"></div>
        <div class="xo-board" id="gameBoard" role="group" aria-label="X-O tahtası"></div>

        <!-- Rock-paper-scissors: shown instead of the board (game.js switches on the kind of the game) -->
        <div class="rps-area d-none" id="rpsArea">
          <div id="rpsLive">
            <div class="rps-stage" id="rpsStage" aria-hidden="true"></div>
            <div class="rps-picks" id="rpsPicks" role="group" aria-label="Seçimini yap"></div>
          </div>
          <div class="rps-history" id="rpsHistory"></div>
        </div>

        <!-- Battleship: shown instead of the board (js/game-battleship.js draws it) -->
        <div class="bs-area d-none" id="bsArea">

          <div class="bs-place d-none" id="bsPlace">
            <p class="bs-hint">Gemiyi tahtaya sürükle; çevirmek için gemiye dokun (ya da R tuşuna bas).</p>
            <div class="bs-place-layout">
              <div class="bs-place-board"><div id="bsPlaceBoard"></div></div>
              <div class="bs-side">
                <div class="bs-tray-title">Yerleştirilecek gemiler</div>
                <div class="bs-tray" id="bsTray"></div>
                <div class="bs-tools">
                  <button type="button" class="btn btn-outline-secondary" id="bsRotate"><i class="bi bi-arrow-repeat me-1" aria-hidden="true"></i>Çevir</button>
                  <button type="button" class="btn btn-outline-secondary" id="bsRandom"><i class="bi bi-shuffle me-1" aria-hidden="true"></i>Rastgele diz</button>
                </div>
                <button type="button" class="btn btn-primary bs-ready" id="bsReady" disabled>Hazırım</button>
              </div>
            </div>
          </div>

          <div class="bs-battle d-none" id="bsBattle">
            <div class="bs-counters" id="bsCounters"></div>
            <div class="bs-shot" id="bsShot" role="status" aria-live="polite"></div>
            <div class="bs-tabs" id="bsTabs" role="group" aria-label="Tahta seç">
              <button type="button" class="btn btn-light border" data-board-tab="enemy" aria-pressed="true">Rakibin tahtası</button>
              <button type="button" class="btn btn-light border" data-board-tab="mine" aria-pressed="false">Senin filon</button>
            </div>
            <div class="bs-boards" id="bsBoards" data-tab="enemy">
              <section class="bs-panel bs-panel-enemy" aria-labelledby="bsEnemyTitle">
                <h2 class="bs-panel-title" id="bsEnemyTitle">Rakibin tahtası</h2>
                <div id="bsEnemyBoard"></div>
              </section>
              <section class="bs-panel bs-panel-mine" aria-labelledby="bsMineTitle">
                <h2 class="bs-panel-title" id="bsMineTitle">Senin filon</h2>
                <div id="bsMineBoard"></div>
              </section>
            </div>
          </div>

        </div>
        <div class="xo-actions" id="gameActions"></div>
      </div>

    </div>
  </div>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div id="chatDock" class="chat-dock">
  <div class="chat-dock-bar" onclick="toggleChatDockList()">
    <i class="bi bi-chat-dots-fill"></i> Sohbetler
  </div>
  <div class="chat-dock-list d-none" id="chatDockList"></div>
</div>
<div id="chatPopups" class="chat-popups"></div>

<script src="js/navbar.js"></script>
<script src="js/app.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/navbar-badge.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<script src="js/realtime.js"></script>
<script src="js/navbar-search.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.21.3/index.js"></script>
<script src="js/chat-data.js"></script>
<script src="js/chat-composer.js"></script>
<script src="js/chat-dock.js"></script>
<script src="js/game-common.js"></script>
<script src="js/game-battleship.js"></script>
<script src="js/game.js"></script>
</body>
</html>
